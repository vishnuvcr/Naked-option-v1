name: Phase 7 Dhan History Pipeline — Offline Tests

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "scripts/dhan_history_pipeline.py"
      - "scripts/test_dhan_history_pipeline.py"
      - ".github/workflows/phase-07-dhan-history-pipeline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-dhan-history-pipeline-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests-only-no-secrets-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline and mocked validation tests only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dhan_history_pipeline.py
          python scripts/dhan_history_pipeline.py
