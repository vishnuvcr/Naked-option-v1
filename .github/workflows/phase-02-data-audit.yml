name: Phase 2 — Data Audit

on:
  push:
    branches:
      - phase-02-developer
      - developer
      - phase-02-tester
      - tester
  pull_request:
    branches:
      - developer
      - tester
  workflow_dispatch:

jobs:
  data-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-phase2-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-phase2-

      - name: Cache raw research data
        uses: actions/cache@v4
        with:
          path: data/cache/raw
          key: phase2-raw-${{ hashFiles('research/data/SOURCE_MANIFEST.csv', 'scripts/acquire_official_option_samples.py') }}
          restore-keys: |
            phase2-raw-

      - name: Validate source manifest
        run: python scripts/validate_source_manifest.py

      - name: Build deterministic PIT fixture
        run: python scripts/build_pit_fixture.py

      - name: Validate PIT fixture
        run: python scripts/validate_pit_fixture.py

      - name: Probe public source endpoints
        run: python scripts/probe_sources.py

      - name: Probe approved Hugging Face datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/probe_huggingface_datasets.py

      - name: Acquire official NIFTY option archive samples
        run: python scripts/acquire_official_option_samples.py

      - name: Validate official archive schemas
        run: python scripts/validate_official_option_samples.py

      - name: Build immutable snapshot manifest
        run: python scripts/build_snapshot_manifest.py

      - name: Upload Phase 2 audit report
        uses: actions/upload-artifact@v4
        with:
          name: phase2-source-audit
          path: |
            data/reports/source_probe.json
            data/reports/huggingface_dataset_probe.json
            data/reports/official_sample_acquisition.json
            data/fixtures/pit_fixture.csv
            data/manifests/phase2_official_option_samples.json
          if-no-files-found: error
