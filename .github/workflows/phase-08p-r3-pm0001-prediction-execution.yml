name: Phase 8P R3A PM0001 prediction execution and frozen results

on:
  workflow_dispatch:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - .github/workflows/phase-08p-r3-pm0001-prediction-execution.yml
      - scripts/create_pm0001_execution_gate_r3.py
      - scripts/run_pm0001_data_execution_precheck_r3a.py
      - scripts/test_run_pm0001_data_execution_precheck_r3a.py
      - scripts/run_pm0001_prediction_sweep_r3.py
      - scripts/freeze_pm0001_result_bundle_r3.py
      - scripts/prediction_features_r3.py
      - scripts/test_prediction_features_r3.py
      - scripts/validate_prediction_feature_contract_r3.py
      - scripts/prediction_pm0001_executor_r3.py
      - scripts/prediction_logistic_adapter_r3.py
      - scripts/prediction_logistic_calibration_r3.py
      - scripts/prediction_statistics.py
      - scripts/prediction_walkforward_r3.py
      - scripts/test_create_pm0001_execution_gate_r3.py
      - scripts/test_run_pm0001_prediction_sweep_r3.py
      - scripts/test_freeze_pm0001_result_bundle_r3.py
      - scripts/test_prediction_pm0001_executor_r3.py
      - scripts/test_prediction_logistic_calibration_r3.py
      - scripts/test_prediction_walkforward_r3.py
      - scripts/test_pm0001_data_execution_precheck_r3.py
      - research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json
      - research/registry/PREDICTION_FEATURE_CONSTRUCTION_CORRECTION_R3A_2026-10-14.json

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-08p-r3a-pm0001-prediction-execution
  cancel-in-progress: false

jobs:
  pm0001-empirical-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize unique artifact paths
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT="research/results/phase8p-pm0001/run-$GITHUB_RUN_ID"
          echo "RUN_ROOT=$RUN_ROOT" >> "$GITHUB_ENV"
          echo "RUN_ENCRYPTED_PREFLIGHT=research/gates/PREDICTION_ENCRYPTED_BUNDLE_PREFLIGHT_R3_RUN_$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
          echo "RUN_PREFLIGHT=research/gates/PREDICTION_DATA_PREFLIGHT_R3_RUN_$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
          echo "RUN_PRECHECK=research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_RUN_$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
          echo "RUN_GATE=research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_RUN_$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
          echo "RUN_RESULT=$RUN_ROOT/result_bundle.json" >> "$GITHUB_ENV"
          echo "RUN_SUMMARY=$RUN_ROOT/summary.json" >> "$GITHUB_ENV"
          echo "RUN_ERRORS=$RUN_ROOT/errors.jsonl" >> "$GITHUB_ENV"
          echo "RUN_CSV=$RUN_ROOT/config_fold_results.csv" >> "$GITHUB_ENV"
          echo "RUN_REPORT=$RUN_ROOT/PM0001_PREDICTION_RESULTS.md" >> "$GITHUB_ENV"
          echo "RUN_MANIFEST=$RUN_ROOT/freeze_manifest.json" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded test and modeling dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Compile execution and freeze code
        id: syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/create_pm0001_execution_gate_r3.py \
            scripts/run_pm0001_data_execution_precheck_r3.py \
            scripts/run_pm0001_data_execution_precheck_r3a.py \
            scripts/run_pm0001_prediction_sweep_r3.py \
            scripts/freeze_pm0001_result_bundle_r3.py \
            scripts/prediction_features_r3.py \
            scripts/validate_prediction_feature_contract_r3.py \
            scripts/prediction_pm0001_executor_r3.py \
            scripts/prediction_logistic_adapter_r3.py \
            scripts/prediction_logistic_calibration_r3.py \
            scripts/prediction_statistics.py \
            scripts/prediction_walkforward_r3.py

      - name: Run synthetic-only tests before retrieving data
        id: synthetic-tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_prediction_features_r3.py' -v
          python -m unittest discover -s scripts -p 'test_run_pm0001_data_execution_precheck_r3a.py' -v
          python -m unittest discover -s scripts -p 'test_create_pm0001_execution_gate_r3.py' -v
          python -m unittest discover -s scripts -p 'test_run_pm0001_prediction_sweep_r3.py' -v
          python -m unittest discover -s scripts -p 'test_freeze_pm0001_result_bundle_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_pm0001_executor_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_logistic_calibration_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_walkforward_r3.py' -v
          python -m unittest discover -s scripts -p 'test_pm0001_data_execution_precheck_r3.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("scripts/run_pm0001_prediction_sweep_r3.py").read_text()
          assert "validate_run_gate" in src and "holdout_accessed" in src
          print(json.dumps({"status":"PASS_SYNTHETIC_TESTS_ONLY","market_data_loaded":False,"model_fit_performed":False,"holdout_accessed":False},sort_keys=True))
          PY

      - name: Verify registered configs and synthetic implementation source pins
        if: steps.synthetic-tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path(".")
          gate=json.loads((root/"research/gates/PREDICTION_PM0001_IMPLEMENTATION_GATE_R3_2026-10-14.json").read_text())
          assert gate["status"]=="PASS_SYNTHETIC_DEVELOPER_TESTED_ONLY"
          for path,expected in gate["source_blob_pins"].items():
              raw=(root/path).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert actual==expected, f"stale implementation pin: {path}"
          eligibility=json.loads((root/"research/gates/PREDICTION_ELIGIBILITY_DISPOSITION_R3_2026-10-13.json").read_text())
          assert eligibility["record_count"]==40000
          assert eligibility["empirical_fit_authorized"] is False
          assert eligibility["disposition_counts"]["ELIGIBLE_PENDING_EXECUTOR_GATE"]==40
          assert eligibility["implementation_gate_status"]==gate["status"]
          print("Exact implementation/registry pins verified.")
          PY

      - name: Download and verify pinned canonical data; decrypt only in runner temp
        id: data
        if: steps.synthetic-tests.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r3a-pm0001-run-$GITHUB_RUN_ID"
          mkdir -p "$WORK/unpacked" "$WORK/plain-parts"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11698879857" \
            -o "$WORK/artifact-metadata.json"
          python - "$WORK/artifact-metadata.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          expected={"id":11698879857,"expired":False,"digest":"sha256:40f3e54472d47cd8e6c4eb17d3a6b302fcf3059a0ab395695d4d3c6c3e5bb45b","size_in_bytes":231076122}
          print(json.dumps({k:x.get(k) for k in ("id","expired","digest","size_in_bytes","name")},sort_keys=True))
          for k,v in expected.items():
              if x.get(k)!=v: raise SystemExit(f"PINNED_ARTIFACT_METADATA_MISMATCH:{k}")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11698879857/zip" > "$WORK/source.zip"
          echo "40f3e54472d47cd8e6c4eb17d3a6b302fcf3059a0ab395695d4d3c6c3e5bb45b  $WORK/source.zip" | sha256sum -c -
          unzip -q "$WORK/source.zip" -d "$WORK/unpacked"
          MANIFEST="$(find "$WORK/unpacked" -type f -name dataset_manifest.json -print -quit)"
          test -n "$MANIFEST"
          BUNDLE="$(dirname "$MANIFEST")"
          python -m pip install --disable-pip-version-check -r requirements-composite.txt
          python scripts/validate_phase8_cached_composite_bundle.py \
            --bundle-dir "$BUNDLE" \
            --reference-manifest research/data/DERIVED_DATASET_MANIFEST_R2_RUN_38126168547.json \
            --output "$RUN_ENCRYPTED_PREFLIGHT"
          python scripts/decrypt_nifty_1m_composite.py \
            --input-dir "$BUNDLE" \
            --output-dir "$WORK/plain-parts" \
            --merge-output "$WORK/merged.csv.gz"
          python scripts/preflight_prediction_dataset_r3.py \
            --merged-gzip "$WORK/merged.csv.gz" \
            --calendar research/data/NSE_CAPITAL_MARKET_SESSION_CALENDAR_R3_2026-10-13.json \
            --preregistration research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json \
            --preprocessing-rules research/data/PREDICTION_DATA_PREPROCESSING_RULES_R3_2026-10-13.json \
            --output "$RUN_PREFLIGHT"
          echo "MERGED_GZIP=$WORK/merged.csv.gz" >> "$GITHUB_ENV"

      - name: Run corrected 320-cell data precheck (no model fitting)
        id: precheck
        if: always() && steps.data.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python scripts/run_pm0001_data_execution_precheck_r3a.py \
            --merged-gzip "$MERGED_GZIP" \
            --preflight "$RUN_PREFLIGHT" \
            --output "$RUN_PRECHECK" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if test -f "$RUN_PRECHECK"; then
            python - "$RUN_PRECHECK" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print(json.dumps({k:v for k,v in x.items() if k not in {"rows","feature_batch_diagnostics"}},sort_keys=True,indent=2))
          for name,d in sorted(x.get("feature_batch_diagnostics",{}).items()):
              print(json.dumps({"feature_batch":name,**{k:d.get(k) for k in ("samples_emitted","target_pairs_missing","target_pair_missing_fraction","missing_session_close_count","session_close_source_time_1529_count","session_close_source_time_1530_count")}},sort_keys=True))
          PY
          fi
          exit 0

      - name: Create exact execution gate for this report
        id: gate
        if: steps.precheck.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/create_pm0001_execution_gate_r3.py \
            --preflight "$RUN_PREFLIGHT" \
            --precheck-report "$RUN_PRECHECK" \
            --feature-report research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json \
            --output "$RUN_GATE" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Run prediction sweep through the validated gate
        id: sweep
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          GZIP_PATH="$RUNNER_TEMP/r3a-pm0001-run-$GITHUB_RUN_ID/merged.csv.gz"
          python scripts/run_pm0001_prediction_sweep_r3.py \
            --merged-gzip "$GZIP_PATH" \
            --preflight-report "$RUN_PREFLIGHT" \
            --precheck-report "$RUN_PRECHECK" \
            --execution-gate "$RUN_GATE" \
            --output "$RUN_RESULT" \
            --summary "$RUN_SUMMARY" \
            --errors "$RUN_ERRORS" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate, aggregate and freeze terminal outcomes
        id: freeze
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/freeze_pm0001_result_bundle_r3.py \
            --result-bundle "$RUN_RESULT" \
            --summary "$RUN_SUMMARY" \
            --errors "$RUN_ERRORS" \
            --precheck-report "$RUN_PRECHECK" \
            --execution-gate "$RUN_GATE" \
            --preflight-report "$RUN_PREFLIGHT" \
            --feature-report research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json \
            --csv "$RUN_CSV" \
            --report-markdown "$RUN_REPORT" \
            --manifest "$RUN_MANIFEST" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload aggregate outcomes and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8p-pm0001-results-run-\${{ github.run_id }}
          if-no-files-found: warn
          path: |
            research/gates/PREDICTION_ENCRYPTED_BUNDLE_PREFLIGHT_R3_RUN_\${{ github.run_id }}.json
            research/gates/PREDICTION_DATA_PREFLIGHT_R3_RUN_\${{ github.run_id }}.json
            research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_RUN_\${{ github.run_id }}.json
            research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_RUN_\${{ github.run_id }}.json
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/result_bundle.json
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/summary.json
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/errors.jsonl
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/config_fold_results.csv
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/PM0001_PREDICTION_RESULTS.md
            research/results/phase8p-pm0001/run-\${{ github.run_id }}/freeze_manifest.json
            research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json

      - name: Remove temporary decrypted data
        if: always()
        shell: bash
        run: |
          set +e
          WORK="$RUNNER_TEMP/r3a-pm0001-run-$GITHUB_RUN_ID"
          if test -d "$WORK"; then rm -rf "$WORK"; fi

      - name: Update README, status, error log and run log; commit all results
        id: publish
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PUSH_TOKEN: \${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          python - "$RUN_PRECHECK" "$RUN_GATE" "$RUN_RESULT" "$RUN_SUMMARY" "$RUN_ERRORS" "$RUN_MANIFEST" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          precheck,gate,result,summary,errors,manifest,runid,source=sys.argv[1:]
          p={k:Path(v) for k,v in {"precheck":precheck,"gate":gate,"result":result,"summary":summary,"errors":errors,"manifest":manifest}.items()}
          def read(path):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return {}
          x=read(p["summary"]); pc=read(p["precheck"]); g=read(p["gate"])
          es=[]
          if p["errors"].is_file():
              for line in p["errors"].read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      try: es.append(json.loads(line))
                      except Exception: es.append({"exception_message":"Unparseable error entry"})
          acquired=x.get("results_acquired") is True and p["manifest"].is_file()
          link=f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','vishnuvcr/Naked-option-v1')}/actions/runs/{runid}"
          entry=(f"## {datetime.now(timezone.utc).isoformat()} — Phase 8P R3A run {runid}\n\n"
                 f"- Workflow: [run {runid}]({link}); source commit {source}.\n"
                 f"- Result status: {x.get('status','NO_COMPLETE_RESULT_BUNDLE')}; empirical fit rows: {x.get('empirical_fits_performed',0)}; results_acquired={str(bool(acquired)).lower()}.\n"
                 f"- Precheck: {json.dumps(pc.get('status_counts',{}),sort_keys=True)}; terminal result accounting: {json.dumps(x.get('terminal_status_counts',{}),sort_keys=True)}.\n"
                 f"- Execution gate: {g.get('status','MISSING_OR_FAILED')}; precheck fitting false and holdout access false.\n"
                 f"- Runtime error rows: {len(es)}; result manifest: {str(p['manifest']) if p['manifest'].is_file() else 'NOT_CREATED'}.\n\n")
          for name in ("README.md","research/STATUS.md"):
              q=Path(name);q.write_text(entry+q.read_text(encoding="utf-8"),encoding="utf-8")
          for name in ("research/ERROR_LOG.md","research/logs/ERROR_LOG.md"):
              q=Path(name);extra=""
              for e in es:
                  extra+=f"- {e.get('step')} / {e.get('config_id')} / {e.get('fold_id')}: {e.get('exception_type')}: {e.get('exception_message')}; traceback SHA256 {e.get('traceback_sha256')}.\n"
              q.write_text(q.read_text(encoding="utf-8").rstrip()+"\n\n"+entry+extra,encoding="utf-8")
          for name in ("research/logs/RESEARCH_LOG.md","research/logs/CHAT_LOG.md"):
              q=Path(name);q.write_text(q.read_text(encoding="utf-8").rstrip()+"\n\n"+entry,encoding="utf-8")
          print(json.dumps({"run_id":runid,"results_acquired":acquired,"precheck":pc.get("status_counts",{}),"fits":x.get("empirical_fits_performed",0),"errors":len(es)},sort_keys=True))
          PY
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          for path in README.md research/STATUS.md research/ERROR_LOG.md research/logs/ERROR_LOG.md research/logs/RESEARCH_LOG.md research/logs/CHAT_LOG.md "$RUN_ENCRYPTED_PREFLIGHT" "$RUN_PREFLIGHT" "$RUN_PRECHECK" "$RUN_GATE" "$RUN_RESULT" "$RUN_SUMMARY" "$RUN_ERRORS" "$RUN_CSV" "$RUN_REPORT" "$RUN_MANIFEST" research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json; do
            if test -f "$path"; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "results_acquired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish Phase 8P R3A run $GITHUB_RUN_ID artifacts and outcomes"
          if test -n "$PUSH_TOKEN"; then git remote set-url origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"; fi
          git push origin HEAD:phase-08-prediction-developer
          acquired=false
          if test -f "$RUN_MANIFEST"; then
            acquired="$(python - "$RUN_MANIFEST" <<'PY'
          import json,sys
          print("true" if json.load(open(sys.argv[1])).get("results_acquired") is True else "false")
          PY
            )"
          fi
          echo "results_acquired=$acquired" >> "$GITHUB_OUTPUT"
          echo "artifact_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Submit frozen results for independent tester review
        id: review-submit
        if: steps.publish.outcome == 'success' && steps.publish.outputs.results_acquired == 'true' && steps.freeze.outcome == 'success'
        shell: bash
        env:
          REVIEW_PUSH_TOKEN: \${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_PUSH_TOKEN" || { echo "GH_TOKEN secret required for tester submission." >&2; exit 1; }
          tested_commit="$(git rev-parse HEAD)"
          manifest="$RUN_MANIFEST"
          manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          python - "$tested_commit" "$manifest" "$manifest_sha" "$GITHUB_RUN_ID" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          tested_commit,manifest_path,manifest_sha,runid=sys.argv[1:]
          sources=[
            "scripts/create_pm0001_execution_gate_r3.py",
            "scripts/run_pm0001_data_execution_precheck_r3.py",
            "scripts/run_pm0001_data_execution_precheck_r3a.py",
            "scripts/run_pm0001_prediction_sweep_r3.py",
            "scripts/freeze_pm0001_result_bundle_r3.py",
            "scripts/prediction_features_r3.py",
            "scripts/validate_prediction_feature_contract_r3.py",
            "scripts/prediction_pm0001_executor_r3.py",
            "scripts/prediction_logistic_adapter_r3.py",
            "scripts/prediction_logistic_calibration_r3.py",
            "scripts/prediction_statistics.py",
            "scripts/prediction_walkforward_r3.py",
            "scripts/test_run_pm0001_data_execution_precheck_r3a.py",
            "research/registry/PREDICTION_FEATURE_CONSTRUCTION_CORRECTION_R3A_2026-10-14.json",
            "research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json"]
          blobs={p:subprocess.check_output(["git","rev-parse",f"{tested_commit}:{p}"],text=True).strip() for p in sources}
          obj={"schema_version":"prediction-results-acquired-review-request-r3-v1","run_id":str(runid),"tested_source_commit":tested_commit,"result_bundle_manifest_path":manifest_path,"result_bundle_manifest_sha256":manifest_sha,"results_acquired":True,"changed_source_blobs":blobs,"review_gate":"CONSOLIDATED_POST_RESULTS_INDEPENDENT_REVIEW_ONLY","holdout_accessed":False}
          Path("research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json").write_text(json.dumps(obj,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          git add research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json
          git commit -m "Submit Phase 8P acquired bundle for independent review"
          git remote set-url origin "https://x-access-token:$REVIEW_PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin HEAD:phase-08-prediction-developer
