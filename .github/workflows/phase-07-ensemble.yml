# Phase 7 Run 622 correction trigger: no scientific logic change.
# Phase 7 verification trigger: no scientific logic change.
name: Phase 7 Ensemble

on:
  workflow_call:
    inputs:
      empirical_authorized:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      empirical_authorized:
        description: "Tester-approved empirical authorization"
        required: true
        type: boolean
        default: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow
      - name: Restore cached research data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
          key: phase7-data-${{ runner.os }}-${{ hashFiles('research/phase2/**','research/phase6/PHASE6_METHOD_SPEC.md','research/phase7/PHASE7_METHOD_SPEC.md') }}
          restore-keys: |
            phase7-data-${{ runner.os }}-
      - name: Acquire daily layer
        run: python scripts/acquire_nifty_daily_history.py
      - name: Acquire intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_intraday_sample.py
      - name: Acquire global reference
        run: python scripts/acquire_global_reference.py
      - run: python scripts/test_phase7_ensemble.py
      - name: Correction-approval validator regression
        run: python scripts/test_phase7_correction_approval.py
      - name: Reference artifact regression
        run: python scripts/test_phase7_reference_artifact.py

  reference-artifact-authorization:
    name: phase7-reference-artifact-tester-gate
    needs: regression
    if: ${{ inputs.empirical_authorized == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require independent tester approval for the exact protected snapshot
        run: |
          set -euo pipefail
          test -f research/gates/PHASE7_REFERENCE_ARTIFACT_CODE_TESTER.md
          grep -q "Decision: PASS WITH SCOPED RESTRICTIONS" research/gates/PHASE7_REFERENCE_ARTIFACT_CODE_TESTER.md
          grep -q "artifact-output code only" research/gates/PHASE7_REFERENCE_ARTIFACT_CODE_TESTER.md
          test -f research/gates/PHASE7_RUN925_CORRECTION_CODE_TESTER.md
          test -f research/gates/PHASE7_RUN925_CORRECTION_APPROVAL.json
          grep -q "Decision: PASS WITH SCOPED RESTRICTIONS" research/gates/PHASE7_RUN925_CORRECTION_CODE_TESTER.md
          grep -q "fresh empirical execution only" research/gates/PHASE7_RUN925_CORRECTION_CODE_TESTER.md
          python scripts/validate_phase7_correction_approval.py --head "${GITHUB_SHA}"
          echo "Phase 7 tester report, manifest, reviewed commit and protected-file hashes PASS"

  empirical:
    needs: [regression, reference-artifact-authorization]
    if: ${{ inputs.empirical_authorized == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow
      - name: Restore cached research data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
          key: phase7-data-${{ runner.os }}-${{ hashFiles('research/phase2/**','research/phase6/PHASE6_METHOD_SPEC.md','research/phase7/PHASE7_METHOD_SPEC.md') }}
          restore-keys: |
            phase7-data-${{ runner.os }}-
      - name: Acquire daily layer
        run: python scripts/acquire_nifty_daily_history.py
      - name: Acquire intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_intraday_sample.py
      - name: Acquire global reference
        run: python scripts/acquire_global_reference.py
      - run: python scripts/run_phase7_ensemble.py
      - run: python scripts/validate_phase7_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-ensemble-results
          path: data/reports/phase7_ensemble_results.json
      - name: Upload immutable row-level reference artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-ensemble-reference
          path: |
            data/reports/phase7_ensemble_results.json
            data/reports/phase7_reference/
