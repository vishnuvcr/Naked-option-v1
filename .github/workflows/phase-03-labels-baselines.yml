name: Phase 3 — Labels and Baselines

on:
  push:
    branches:
      - phase-03-developer
      - developer
      - phase-03-tester
      - tester
  pull_request:
    branches:
      - developer
      - tester
  workflow_dispatch:

concurrency:
  group: phase3-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn pyarrow

      - name: Cache Phase 3 data
        uses: actions/cache@v4
        with:
          path: data/cache/raw/phase3
          key: phase3-data-${{ hashFiles('scripts/acquire_nifty_daily_history.py', 'scripts/discover_hf_intraday.py') }}
          restore-keys: |
            phase3-data-

      - name: Validate frozen Phase 3 protocol
        run: python scripts/validate_phase3_protocol.py

      - name: Acquire official NIFTY daily history
        run: python scripts/acquire_nifty_daily_history.py

      - name: Discover HF intraday research reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/discover_hf_intraday.py

      - name: Upload Phase 3 data manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase3-data-manifest
          path: |
            data/reports/nifty50_daily_manifest.json
            data/reports/hf_intraday_discovery.json
          if-no-files-found: error
