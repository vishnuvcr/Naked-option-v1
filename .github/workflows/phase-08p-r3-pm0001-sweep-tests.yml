name: Phase 8P R3 PM0001 sweep implementation tests
on:
  workflow_dispatch:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - scripts/create_pm0001_execution_gate_r3.py
      - scripts/test_create_pm0001_execution_gate_r3.py
      - scripts/run_pm0001_prediction_sweep_r3.py
      - scripts/test_run_pm0001_prediction_sweep_r3.py
      - scripts/prediction_pm0001_executor_r3.py
      - scripts/prediction_logistic_adapter_r3.py
      - scripts/prediction_logistic_calibration_r3.py
      - scripts/prediction_statistics.py
      - scripts/prediction_walkforward_r3.py
      - .github/workflows/phase-08p-r3-pm0001-sweep-tests.yml
permissions:
  contents: read
concurrency:
  group: phase-08p-r3-pm0001-sweep-tests
  cancel-in-progress: false
jobs:
  synthetic-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded modeling dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Compile the gated prediction execution path
        run: |
          python -m py_compile \
            scripts/create_pm0001_execution_gate_r3.py \
            scripts/run_pm0001_data_execution_precheck_r3.py \
            scripts/run_pm0001_prediction_sweep_r3.py \
            scripts/prediction_pm0001_executor_r3.py \
            scripts/prediction_logistic_adapter_r3.py \
            scripts/prediction_logistic_calibration_r3.py \
            scripts/prediction_statistics.py \
            scripts/prediction_walkforward_r3.py
      - name: Run synthetic-only gate and sweep tests
        run: |
          python -m unittest discover -s scripts -p 'test_create_pm0001_execution_gate_r3.py' -v
          python -m unittest discover -s scripts -p 'test_run_pm0001_prediction_sweep_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_pm0001_executor_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_logistic_calibration_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_walkforward_r3.py' -v
          python -m unittest discover -s scripts -p 'test_pm0001_data_execution_precheck_r3.py' -v
      - name: Confirm this workflow is synthetic only
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("scripts/run_pm0001_prediction_sweep_r3.py").read_text()
          assert "validate_run_gate" in p
          assert "holdout_accessed": False
          print(json.dumps({
              "status": "PASS_SYNTHETIC_TESTS_ONLY",
              "market_data_loaded": False,
              "model_fit_performed": False,
              "holdout_accessed": False
          }, sort_keys=True))
          PY
