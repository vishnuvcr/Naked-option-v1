name: Repair Missing R2 Method Shards

on:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/generate_missing_method_shards.py"
      - "scripts/pin_config_shard_file_hashes.py"
      - ".github/workflows/repair-missing-method-shards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-prediction-developer
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate absent method shards without overwriting existing shards
        run: python scripts/generate_missing_method_shards.py
      - name: Pin config shard hashes to exact file bytes
        run: python scripts/pin_config_shard_file_hashes.py
      - name: Commit generated shards and manifest hash repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/registry/method_shards/METHODS_V2_R2_PART*.json research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json
          if git diff --cached --quiet; then
            echo "No registry repair changes required."
            exit 0
          fi
          git commit -m "Repair R2 method shards and config integrity hashes"
          git push origin HEAD:phase-08-prediction-developer
