name: Repair and Re-shard R2 Prediction Registry

on:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/reshard_prediction_registry.py"
      - "scripts/build_prediction_compatibility_matrix.py"
      - "scripts/test_prediction_compatibility_matrix.py"
      - "scripts/prediction_registry_synthetic_dryrun.py"
      - "scripts/test_prediction_registry_synthetic_dryrun.py"
      - "scripts/test_prediction_preregistration.py"
      - "scripts/prediction_statistics.py"
      - "scripts/test_prediction_statistics.py"
      - "research/registry/PREDICTION_LABEL_MANIFEST_V2_R2.json"
      - "research/registry/PREDICTION_PREREGISTRATION_V2_R2.json"
      - ".github/workflows/repair-missing-method-shards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-08-r2-registry-repair
  cancel-in-progress: false

jobs:
  reshard-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout developer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Assert exact workflow-trigger commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Pinned checkout: $(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild small, deterministic registry shards
        run: python scripts/reshard_prediction_registry.py
      - name: Build row-level compatibility matrix
        run: python scripts/build_prediction_compatibility_matrix.py
      - name: Run registry shard utility regression tests
        run: python -m unittest discover -s scripts -p "test_shard_prediction_registry.py" -v
      - name: Run deterministic re-sharding tests
        run: python -m unittest discover -s scripts -p "test_reshard_prediction_registry.py" -v
      - name: Run compatibility matrix unit tests
        run: python -m unittest discover -s scripts -p "test_prediction_compatibility_matrix.py" -v
      - name: Run synthetic dry-run restart/error tests
        run: python -m unittest discover -s scripts -p "test_prediction_registry_synthetic_dryrun.py" -v
      - name: Run preregistration source-pin and statistical-rule tests
        run: python -m unittest discover -s scripts -p "test_prediction_preregistration.py" -v
      - name: Run paired block bootstrap and BY FDR numerical tests
        run: python -m unittest discover -s scripts -p "test_prediction_statistics.py" -v
      - name: Audit rebuilt registry before committing
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_prediction_registry_shards.py | tee /tmp/r2-registry-audit.json
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-registry-integrity-audit
          path: /tmp/r2-registry-audit.json
          if-no-files-found: warn
      - name: Commit verified registry data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/registry/method_shards research/registry/config_shards research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json research/registry/PREDICTION_REGISTRY_SHARD_INDEX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_PREREGISTRATION_V2_R2.json
          if git diff --cached --quiet; then
            echo "No registry artifacts changed."
            exit 0
          fi
          git commit -m "Rebuild and validate R2 prediction registry artifacts"
          git fetch origin phase-08-prediction-developer
          git rebase origin/phase-08-prediction-developer
          # Revalidate on the rebased source before any push. Rebuild may be a no-op.
          python scripts/reshard_prediction_registry.py
          python scripts/build_prediction_compatibility_matrix.py
          python -m unittest discover -s scripts -p "test_shard_prediction_registry.py" -v
          python -m unittest discover -s scripts -p "test_reshard_prediction_registry.py" -v
          python -m unittest discover -s scripts -p "test_prediction_compatibility_matrix.py" -v
          python -m unittest discover -s scripts -p "test_prediction_registry_synthetic_dryrun.py" -v
          python -m unittest discover -s scripts -p "test_prediction_preregistration.py" -v
          python -m unittest discover -s scripts -p "test_prediction_statistics.py" -v
          python scripts/audit_prediction_registry_shards.py
          git add -A research/registry/method_shards research/registry/config_shards research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json research/registry/PREDICTION_REGISTRY_SHARD_INDEX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_PREREGISTRATION_V2_R2.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified R2 registry artifacts after rebase"
          fi
          git push origin HEAD:phase-08-prediction-developer
