name: Phase 5 Family D
# D07 protocol clarification and regression pin approved by independent tester before fresh empirical execution.

on:
  push:
    branches:
      - phase-05-developer
    paths:
      - "scripts/run_phase5_family_d.py"
      - "scripts/test_phase5_family_d.py"
      - "research/phase5/**"
      - ".github/workflows/phase-05-family-d.yml"
  workflow_dispatch:

concurrency:
  group: phase5-family-d-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  family-d:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow
      - name: Restore cached research data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
          key: phase5-data-${{ runner.os }}-${{ hashFiles('research/data/SOURCE_MANIFEST.md','research/phase2/**') }}
          restore-keys: |
            phase5-data-${{ runner.os }}-
      - name: Acquire daily layer
        run: python scripts/acquire_nifty_daily_history.py
      - name: Acquire intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_intraday_sample.py
      - name: Run Family D regression tests
        working-directory: scripts
        run: python test_phase5_family_d.py
      - name: Run Family D empirical suite
        run: |
          echo "FAMILY_D_EMPIRICAL_START $(date -u +%FT%TZ)"
          python scripts/run_phase5_family_d.py
          echo "FAMILY_D_EMPIRICAL_END $(date -u +%FT%TZ)"
      - name: Validate result schema
        run: |
          python - <<'PY'
          import json
          p="data/reports/phase5_family_d_results.json"
          d=json.load(open(p))
          assert set(d["daily"]["horizons"])=={"1","2","3","5","10"}
          assert set(d["intraday"]["horizons"])=={"5","15","30","60","120"}
          for layer in ("daily","intraday"):
            for h,v in d[layer]["horizons"].items():
              assert all(f"D{i:02d}" in v for i in range(1,16))
          print("PHASE5_SCHEMA_PASS")
          PY
      - name: Upload Family D artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-family-d-results
          path: data/reports/phase5_family_d_results.json
