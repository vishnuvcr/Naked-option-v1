name: Phase 8 Saved-Panel Validator Regression

on:
  push:
    branches: [phase-08-developer]
    paths:
      - scripts/validate_phase7_reference_panels.py
      - scripts/test_phase8_reference_panels.py
      - scripts/verify_phase8_cached_source_inputs.py
      - scripts/test_phase8_cached_source_inputs.py
      - scripts/authorize_phase8_source_cache_bootstrap.py
      - scripts/test_phase8_source_cache_bootstrap.py
      - .github/workflows/phase8-panel-validator-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pyarrow threadpoolctl
      - name: Validate saved-panel aggregation without model refit
        run: python scripts/test_phase8_reference_panels.py
      - name: Verify frozen source cache fail-closed behavior (synthetic only)
        run: python scripts/test_phase8_cached_source_inputs.py
      - name: Verify exact tester approval gates bootstrap (synthetic only)
        run: python scripts/test_phase8_source_cache_bootstrap.py
