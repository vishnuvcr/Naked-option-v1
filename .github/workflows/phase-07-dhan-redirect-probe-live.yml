name: Dhan Redirect Target Guarded Probe

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/gates/DHAN_REDIRECT_TARGET_APPROVAL.json"
      - ".github/workflows/phase-07-dhan-redirect-probe-live.yml"
  workflow_dispatch:
    inputs:
      confirm_probe:
        description: "Confirm the one redirect-target-only request"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: dhan-redirect-probe-single-use-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarded-redirect-probe:
    if: github.ref == 'refs/heads/phase-07-developer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-07-developer
          fetch-depth: 0
      - name: Require explicit confirmation for manual probe runs
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_PROBE: ${{ inputs.confirm_probe }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PROBE" != "true" ]]; then
            echo "Blocked: manual probe confirmation was not selected."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests before secret is available
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dhan_market_data_recovery.py
      - name: Validate exact one-request manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_dhan_redirect_probe_approval.py check
      - name: Spend manifest before the single diagnostic request
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_dhan_redirect_probe_approval.py spend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gates/DHAN_REDIRECT_TARGET_APPROVAL.json
          git commit -m "Spend one-run Dhan redirect-target probe approval"
          git push origin HEAD:phase-07-developer
      - name: One request - record redirect scheme and hostname only
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_REDIRECT_DIAGNOSTIC_AUTHORIZED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dhan_market_data_recovery.py
      - name: Upload redirect-target-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-redirect-target-probe
          path: data/reports/dhan_redirect_target_probe.json
          if-no-files-found: warn
          retention-days: 30

# This workflow never follows the redirect and never forwards the token to
# the target host. It does not fetch candles, history or place orders.
