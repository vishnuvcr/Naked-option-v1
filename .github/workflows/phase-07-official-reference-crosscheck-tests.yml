name: Phase 7 Official Sample Cross-Check — Offline Tests

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "scripts/official_reference_crosscheck.py"
      - "scripts/run_official_reference_crosscheck.py"
      - "scripts/test_official_reference_crosscheck.py"
      - "scripts/dhan_instrument_master.py"
      - "research/phase7/DHAN_SAMPLE_OFFICIAL_REFERENCE_CROSSCHECK_PLAN.md"
      - ".github/workflows/phase-07-official-reference-crosscheck-tests.yml"
  workflow_dispatch:
    inputs:
      confirm_offline_tests:
        description: "Run only offline/mocked tests against phase-07-developer. No public-source request is made."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: phase7-official-reference-crosscheck-offline
  cancel-in-progress: false

jobs:
  offline-tests-only-no-secrets:
    if: github.ref == 'refs/heads/phase-07-developer' || (github.event_name == 'workflow_dispatch' && inputs.confirm_offline_tests == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-07-developer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run all official-source tests with mocked responses only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/official_reference_crosscheck.py scripts/run_official_reference_crosscheck.py scripts/test_official_reference_crosscheck.py
          python scripts/test_official_reference_crosscheck.py
          python scripts/official_reference_crosscheck.py
          echo "PASS: offline-only workflow made no source requests and used no secrets."
