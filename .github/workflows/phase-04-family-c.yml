name: Phase 4 — Family C Statistical Methods

on:
  push:
    branches:
      - phase-04-developer
      - developer
      - phase-04-tester
      - tester
    paths-ignore:
      - "research/logs/**"
      - "research/STATUS.md"
      - "README.md"
  pull_request:
    branches:
      - developer
      - tester
  workflow_dispatch:

concurrency:
  group: phase4-family-c-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statistical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn pyarrow statsmodels arch
      - name: Restore cached research data
        uses: actions/cache@v4
        with:
          path: data/cache/raw/phase3
          key: phase4-family-c-data-${{ hashFiles('scripts/acquire_nifty_daily_history.py','scripts/discover_hf_intraday.py','scripts/acquire_hf_intraday_sample.py') }}
          restore-keys: |
            phase4-family-c-data-
            phase3-data-
      - name: Acquire daily layer
        run: python scripts/acquire_nifty_daily_history.py
      - name: Discover intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/discover_hf_intraday.py
      - name: Acquire intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_intraday_sample.py
      - name: Run Family C regression tests
        working-directory: scripts
        run: python test_phase4_family_c.py

      - name: Run Family C statistical methods
        run: python scripts/run_phase4_family_c.py
      - name: Validate Family C results
        run: python scripts/validate_phase4_family_c.py
      - name: Upload Family C artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4-family-c-results
          path: data/reports/phase4_family_c_results.json
          if-no-files-found: error
