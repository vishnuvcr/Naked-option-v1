name: Phase 8P R3 logistic family synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/prediction_logistic_adapter_r3.py"
      - "scripts/prediction_chronological_calibration_r3.py"
      - "scripts/test_prediction_logistic_adapter_r3.py"
      - "scripts/test_prediction_chronological_calibration_r3.py"
      - "scripts/prediction_probit_adapter_r3.py"
      - "scripts/test_prediction_probit_adapter_r3.py"
      - "scripts/prediction_hmm_adapter_r3.py"
      - "scripts/test_prediction_hmm_adapter_r3.py"
      - "scripts/prediction_markov_switching_logit_r3.py"
      - "scripts/test_prediction_markov_switching_logit_r3.py"
      - "scripts/prediction_bayesian_dynamic_logit_r3.py"
      - "scripts/test_prediction_bayesian_dynamic_logit_r3.py"
      - "scripts/prediction_change_point_adapter_r3.py"
      - "scripts/test_prediction_change_point_adapter_r3.py"
      - "scripts/prediction_temporal_convolution_adapter_r3.py"
      - "scripts/test_prediction_temporal_convolution_adapter_r3.py"
      - "scripts/prediction_discriminant_adapters_r3.py"
      - "scripts/test_prediction_discriminant_adapters_r3.py"
      - "scripts/prediction_elastic_net_logistic_adapter_r3.py"
      - "scripts/test_prediction_elastic_net_logistic_adapter_r3.py"
      - "scripts/prediction_tree_ensemble_adapters_r3.py"
      - "scripts/test_prediction_tree_ensemble_adapters_r3.py"
      - "scripts/prediction_margin_distance_adapters_r3.py"
      - "scripts/test_prediction_margin_distance_adapters_r3.py"
      - "scripts/prediction_gam_adapter_r3.py"
      - "scripts/test_prediction_gam_adapter_r3.py"
      - "scripts/prediction_shallow_mlp_adapter_r3.py"
      - "scripts/test_prediction_shallow_mlp_adapter_r3.py"
      - ".github/workflows/phase-08p-r3-logistic-family-synthetic.yml"

permissions:
  contents: read

jobs:
  synthetic-family-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert immutable checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned scientific dependencies
        run: python -m pip install numpy==2.2.6 scikit-learn==1.7.2
      - name: Run synthetic logistic and chronological calibration tests
        run: |
          python -m unittest discover -s scripts -p "test_prediction_logistic_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_chronological_calibration_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_probit_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_hmm_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_markov_switching_logit_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_bayesian_dynamic_logit_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_temporal_convolution_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_change_point_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_discriminant_adapters_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_elastic_net_logistic_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_tree_ensemble_adapters_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_margin_distance_adapters_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_gam_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_shallow_mlp_adapter_r3.py" -v
      - name: Compile family modules
        run: python -m py_compile scripts/prediction_logistic_adapter_r3.py scripts/prediction_chronological_calibration_r3.py scripts/prediction_probit_adapter_r3.py scripts/prediction_hmm_adapter_r3.py scripts/prediction_markov_switching_logit_r3.py scripts/prediction_bayesian_dynamic_logit_r3.py scripts/prediction_change_point_adapter_r3.py scripts/prediction_temporal_convolution_adapter_r3.py scripts/prediction_discriminant_adapters_r3.py scripts/prediction_elastic_net_logistic_adapter_r3.py scripts/prediction_tree_ensemble_adapters_r3.py scripts/prediction_margin_distance_adapters_r3.py scripts/prediction_gam_adapter_r3.py scripts/prediction_shallow_mlp_adapter_r3.py
      - name: Assert no market data or holdout access in adapter modules
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path("scripts/prediction_logistic_adapter_r3.py"), Path("scripts/prediction_chronological_calibration_r3.py"), Path("scripts/prediction_probit_adapter_r3.py"), Path("scripts/prediction_hmm_adapter_r3.py"), Path("scripts/prediction_markov_switching_logit_r3.py"), Path("scripts/prediction_bayesian_dynamic_logit_r3.py"), Path("scripts/prediction_change_point_adapter_r3.py"), Path("scripts/prediction_temporal_convolution_adapter_r3.py"), Path("scripts/prediction_discriminant_adapters_r3.py"), Path("scripts/prediction_elastic_net_logistic_adapter_r3.py"), Path("scripts/prediction_tree_ensemble_adapters_r3.py"), Path("scripts/prediction_margin_distance_adapters_r3.py"), Path("scripts/prediction_gam_adapter_r3.py"), Path("scripts/prediction_shallow_mlp_adapter_r3.py")]
          for p in files:
              s = p.read_text()
              for forbidden in ("HOLDOUT_ACCESS_TOKEN", "market_data.csv", "holdout.csv"):
                  assert forbidden not in s, (str(p), forbidden)
          print("synthetic adapters only; no market data or holdout access")
          PY
