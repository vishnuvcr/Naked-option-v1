name: PPR-4 Read-Only Source Inventory Check

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/phase7/PPR4_SOURCE_AVAILABILITY_MANIFEST.json"
      - "research/phase7/PPR4_SOURCE_AVAILABILITY_REGISTER.csv"
      - "research/phase7/PPR4_SOURCE_FEASIBILITY_AUDIT.md"
      - "research/phase7/PPR4_HOLDOUT_METADATA_AUDIT.json"
      - "research/phase7/PPR4_REPO_CACHE_INVENTORY.csv"
      - "research/data/SOURCE_MANIFEST.csv"
      - "research/data/GLOBAL_SOURCE_MANIFEST.csv"
      - "research/data/AVAILABILITY_ALIGNMENT.md"
      - "research/data/PIT_RULES.md"
      - "research/data/CACHE_POLICY.md"
      - "research/data/DATA_SCHEMA.md"
      - "scripts/validate_ppr4_source_inventory.py"
      - ".github/workflows/phase-07-ppr4-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppr4-source-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source inventory and hard restrictions
        run: python scripts/validate_ppr4_source_inventory.py
