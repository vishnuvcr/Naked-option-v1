name: Phase 8P independent registry review

on:
  push:
    branches: [phase-08-prediction-tester]
    paths:
      - 'research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tester branch
        uses: actions/checkout@v4
        with:
          path: tester
      - name: Read exact developer source pin from tester-owned request snapshot
        id: source_pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          request = json.loads(Path("tester/research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json").read_text(encoding="utf-8"))
          if request.get("results_acquired") is not True:
              raise SystemExit("Tester review is deferred until results_acquired=true.")
          manifest = request.get("result_bundle_manifest_path", "")
          if not manifest:
              raise SystemExit("Missing result_bundle_manifest_path.")
          sha = request.get("tested_source_commit", "")
          if len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit(f"invalid pinned developer source commit: {sha!r}")
          print(f"sha={sha}")
          print(f"result_manifest={manifest}")
          PY
      - name: Check out exact pinned developer source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source_pin.outputs.sha }}
          path: developer
      - name: Verify exact commit and source blob pins
        shell: bash
        run: |
          test "$(git -C developer rev-parse HEAD)" = "${{ steps.source_pin.outputs.sha }}"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          request = json.loads(Path("tester/research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json").read_text(encoding="utf-8"))
          for path, expected in request.get("changed_source_blobs", {}).items():
              actual = subprocess.check_output(["git", "-C", "developer", "rev-parse", f"HEAD:{path}"], text=True).strip()
              if actual != expected:
                  raise SystemExit(f"source blob pin mismatch for {path}: expected={expected}, actual={actual}")
          print("Exact developer commit and changed-source blob pins: PASS")
          PY
      - name: Verify acquired result-bundle manifest and hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          request_path = Path("tester/research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          manifest_path = request["result_bundle_manifest_path"]
          raw = subprocess.check_output(["git", "-C", "developer", "show", f"HEAD:{manifest_path}"])
          manifest_sha = request.get("result_bundle_manifest_sha256", "")
          actual_manifest_sha = hashlib.sha256(raw).hexdigest()
          if len(manifest_sha) != 64 or actual_manifest_sha != manifest_sha:
              raise SystemExit(f"Result-bundle manifest hash mismatch: expected={manifest_sha}, actual={actual_manifest_sha}")
          manifest = json.loads(raw.decode("utf-8"))
          if manifest.get("results_acquired") is not True:
              raise SystemExit("Result-bundle manifest does not assert results_acquired=true")
          artifacts = manifest.get("artifacts", [])
          if not artifacts:
              raise SystemExit("Result-bundle manifest contains no artifacts")
          verified = []
          for item in artifacts:
              path = item.get("path", "")
              expected = item.get("sha256", "")
              if not path or len(expected) != 64:
                  raise SystemExit(f"Invalid artifact pin: {item!r}")
              data = subprocess.check_output(["git", "-C", "developer", "show", f"HEAD:{path}"])
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Result artifact hash mismatch: {path} expected={expected} actual={actual}")
              verified.append(path)
          print(f"Verified {len(verified)} acquired-result artifacts against SHA-256 pins.")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent read-only audit
        run: python tester/scripts/independent_prediction_registry_audit_r2.py --developer-root developer --output prediction-registry-independent-audit.json
      - name: Upload machine-readable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-08p-independent-registry-audit
          path: prediction-registry-independent-audit.json
          if-no-files-found: warn
