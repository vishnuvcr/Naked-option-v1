name: Phase 7 Extension 2 Gate A — Legacy Workflow Disabled (Offline Tests Only)

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "scripts/phase7_extension2_source_feasibility.py"
      - "scripts/test_phase7_extension2_source_feasibility.py"
      - "research/phase7/AVAILABLE_DATA_PREDICTION_EXTENSION_2_SPEC.md"
      - ".github/workflows/phase-07-extension2-source-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-extension2-legacy-offline-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regressions-only:
    name: offline-regressions-only-no-network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline parser/schema tests only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_phase7_extension2_source_feasibility.py

# IMPORTANT: This legacy workflow is intentionally offline-only. It MUST NOT
# call scripts/phase7_extension2_source_feasibility.py or any other source fetcher.
# All live Gate A sampling is owned by phase-07-extension2-source-feasibility-v2.yml
# and remains fail-closed behind the independent exact-snapshot tester manifest.
