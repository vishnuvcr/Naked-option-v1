name: NIFTY 1-Minute Composite Pipeline — Offline Tests

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/gates/NIFTY_1M_COMPOSITE_REQUEST_MANIFEST.json"
      - "research/gates/NIFTY_1M_COMPOSITE_REQUESTS_*.json"
      - "scripts/run_nifty_1m_composite_dataset.py"
      - "scripts/decrypt_nifty_1m_composite.py"
      - "scripts/validate_nifty_1m_composite_manifest.py"
      - "scripts/test_nifty_1m_composite_manifest.py"
      - "scripts/test_nifty_1m_composite_dataset.py"
      - "scripts/run_nifty_1m_spot_diagnostic.py"
      - "scripts/test_nifty_1m_spot_diagnostic.py"
      - "scripts/audit_nifty_1m_composite_cache.py"
      - "scripts/run_nifty_1m_spot_gapfill.py"
      - "scripts/test_nifty_1m_spot_gapfill.py"
      - "scripts/validate_nifty_1m_spot_gapfill_split_proposal.py"
      - "scripts/validate_nifty_1m_spot_failed_window_patch.py"
      - "scripts/run_nifty_1m_spot_failed_window_patch.py"
      - "scripts/test_nifty_1m_spot_failed_window_patch.py"
      - "scripts/diagnose_nifty_1m_unmatched_spot_targets.py"
      - "scripts/test_diagnose_nifty_1m_unmatched_spot_targets.py"
      - "research/gates/NIFTY_1M_SPOT_FAILED_WINDOW_PATCH_PROPOSAL.json"
      - ".github/workflows/phase-07-nifty-1m-spot-failed-window-patch.yml"
      - "research/gates/NIFTY_1M_SPOT_GAPFILL_SPLIT_PROPOSAL.json"
      - ".github/workflows/phase-07-nifty-1m-spot-split-recovery.yml"
      - ".github/workflows/phase-07-unmatched-option-timestamp-diagnostic.yml"
      - "research/gates/NIFTY_1M_SPOT_GAPFILL_MANIFEST.json"
      - "scripts/test_audit_nifty_1m_composite_cache.py"
      - "scripts/audit_nifty_1m_composite_values.py"
      - "scripts/test_audit_nifty_1m_composite_values.py"
      - "scripts/diagnose_nifty_1m_value_anomalies.py"
      - "scripts/test_diagnose_nifty_1m_value_anomalies.py"
      - "scripts/repair_nifty_1m_composite_values.py"
      - "scripts/test_repair_nifty_1m_composite_values.py"
      - "scripts/account_nifty_1m_probe_attempt.py"
      - "scripts/test_account_nifty_1m_probe_attempt.py"
      - "research/gates/NIFTY_1M_SPOT_DIAGNOSTIC_PLAN.json"
      - "scripts/validate_nifty_1m_composite_approval.py"
      - ".github/workflows/phase-07-nifty-1m-composite-live.yml"
      - "requirements-composite.txt"
      - ".github/workflows/phase-07-nifty-1m-composite-tests.yml"
      - ".github/workflows/phase-07-derived-dataset-repair.yml"
      - ".github/workflows/dataset-value-audit.yml"
      - ".github/workflows/phase-07-nifty-1m-composite-spot-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nifty-1m-composite-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-composite.txt
      - name: Install encryption dependency
        run: python -m pip install -r requirements-composite.txt
      - name: Validate scoped diagnostic workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/phase-07-nifty-1m-composite-spot-diagnostic.yml"); YAML.parse_file(".github/workflows/phase-07-nifty-1m-spot-split-recovery.yml"); YAML.parse_file(".github/workflows/phase-07-nifty-1m-spot-failed-window-patch.yml"); YAML.parse_file(".github/workflows/phase-07-unmatched-option-timestamp-diagnostic.yml"); YAML.parse_file(".github/workflows/dataset-value-audit.yml"); YAML.parse_file(".github/workflows/phase-07-derived-dataset-repair.yml"); puts "PASS diagnostic workflows, offline dataset audit, and derived repair YAML parse"'
      - name: Compile collector, decryptor and validators
        run: >-
          python -m py_compile
          scripts/run_nifty_1m_composite_dataset.py
          scripts/decrypt_nifty_1m_composite.py
          scripts/validate_nifty_1m_composite_manifest.py
          scripts/test_nifty_1m_composite_dataset.py
          scripts/test_nifty_1m_composite_manifest.py
          scripts/validate_nifty_1m_composite_approval.py
          scripts/run_nifty_1m_spot_diagnostic.py
          scripts/test_nifty_1m_spot_diagnostic.py
          scripts/audit_nifty_1m_composite_cache.py
          scripts/run_nifty_1m_spot_gapfill.py
          scripts/test_nifty_1m_spot_gapfill.py
          scripts/validate_nifty_1m_spot_gapfill_split_proposal.py
          scripts/validate_nifty_1m_spot_failed_window_patch.py
          scripts/run_nifty_1m_spot_failed_window_patch.py
          scripts/test_nifty_1m_spot_failed_window_patch.py
          scripts/diagnose_nifty_1m_unmatched_spot_targets.py
          scripts/test_diagnose_nifty_1m_unmatched_spot_targets.py
          scripts/test_audit_nifty_1m_composite_cache.py
          scripts/account_nifty_1m_probe_attempt.py
          scripts/test_account_nifty_1m_probe_attempt.py
          scripts/audit_nifty_1m_composite_values.py
          scripts/test_audit_nifty_1m_composite_values.py
          scripts/diagnose_nifty_1m_value_anomalies.py
          scripts/test_diagnose_nifty_1m_value_anomalies.py
          scripts/repair_nifty_1m_composite_values.py
          scripts/test_repair_nifty_1m_composite_values.py
      - name: Run offline manifest and data-pipeline tests
        working-directory: scripts
        run: |
          set -euo pipefail
          python -m unittest -v test_nifty_1m_composite_manifest
          python -m unittest -v test_nifty_1m_composite_dataset
          python -m unittest -v test_nifty_1m_spot_diagnostic
          python -m unittest -v test_account_nifty_1m_probe_attempt
          python -m unittest -v test_audit_nifty_1m_composite_cache
          python -m unittest -v test_nifty_1m_spot_gapfill
          python -m unittest -v test_nifty_1m_spot_failed_window_patch
          python -m unittest -v test_diagnose_nifty_1m_unmatched_spot_targets
          python -m unittest -v test_audit_nifty_1m_composite_values
          python -m unittest -v test_diagnose_nifty_1m_value_anomalies
          python -m unittest -v test_repair_nifty_1m_composite_values
      - name: Verify exact request grid
        run: python scripts/validate_nifty_1m_composite_manifest.py
      - name: Validate acquisition approval helper offline
        run: python scripts/validate_nifty_1m_composite_approval.py self-test

# No secrets, internet API calls, data payloads, model fitting or holdout access are permitted in this workflow.
