name: Phase 8 Greek Enrichment Artifact Independent Tester

on:
  push:
    branches:
      - phase-08-tester
    paths:
      - research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_REQUEST_R1_2026-10-12.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  independent-artifact-audit:
    name: Download and independently audit encrypted R3 dataset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tester role branch
        uses: actions/checkout@v4
        with:
          ref: phase-08-tester
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent synthetic and actual-artifact audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_phase8_greek_artifact_tester.py
      - name: Commit tester-owned review and logs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_DECISION_R1_2026-10-12.json research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_REVIEW_R1_2026-10-12.md research/STATUS.md research/logs/CHAT_LOG.md research/ERROR_LOG.md
          git commit -m "Record independent Greek artifact audit R1 run ${{ github.run_id }}"
          git push origin HEAD:phase-08-tester
      - name: Enforce independent artifact decision
        if: always()
        run: |
          python -c "import json,pathlib; d=json.loads(pathlib.Path('research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_DECISION_R1_2026-10-12.json').read_text()); print('ARTIFACT_TESTER_DECISION='+d['decision']); raise SystemExit(0 if d['decision']=='PASS_WITH_SCOPED_RESTRICTIONS' else 1)"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-greek-enrichment-artifact-audit-r1-${{ github.run_id }}
          path: |
            research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_DECISION_R1_2026-10-12.json
            research/gates/PHASE8_GREEK_ENRICHMENT_ARTIFACT_REVIEW_R1_2026-10-12.md
          if-no-files-found: warn
          retention-days: 90
