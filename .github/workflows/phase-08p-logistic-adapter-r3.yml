name: Phase 8P R3 logistic adapter code gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/prediction_logistic_adapter_r3.py"
      - "scripts/test_prediction_logistic_adapter_r3.py"
      - "scripts/prediction_chronological_calibration_r3.py"
      - "scripts/test_prediction_chronological_calibration_r3.py"
      - ".github/workflows/phase-08p-logistic-adapter-r3.yml"

permissions:
  contents: read

concurrency:
  group: phase-08p-logistic-adapter-r3
  cancel-in-progress: false

jobs:
  synthetic-code-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Run synthetic-only adapter contract tests
        run: python -m unittest discover -s scripts -p "test_prediction_logistic_adapter_r3.py" -v
          python -m unittest discover -s scripts -p "test_prediction_chronological_calibration_r3.py" -v
      - name: Run synthetic-only chronological calibration tests
        run: python -m unittest discover -s scripts -p "test_prediction_logistic_calibration_r3.py" -v
      - name: Assert this workflow did not access data or authorize fitting
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/prediction_logistic_adapter_r3.py").read_text()
          assert "read_csv(" not in source
          assert "holdout" not in source.lower()
          assert "enforce_fit_gate" not in source
          calibration = Path("scripts/prediction_chronological_calibration_r3.py").read_text()
          assert "read_csv(" not in calibration
          assert "holdout" not in calibration.lower()
          print("CODE_ONLY: no market-data loading, holdout access, or empirical fit authorization")
          PY
