name: Phase 8P R4 parameter binding audit

on:
  push:
    branches:
      - phase-08-prediction-param-audit-developer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8p-parameter-binding-audit-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parameter-binding-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Assert immutable checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned scientific dependencies
        shell: bash
        run: python -m pip install numpy==2.2.6 scipy==1.17.1 scikit-learn==1.7.2

      - name: Run complete prediction synthetic test suite
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_prediction_*_r3.py' -v 2>&1 | tee "$RUNNER_TEMP/prediction-synthetic-tests.log"

      - name: Compile source modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("scripts").glob("prediction_*_r3.py"))
          assert files, "No prediction adapter modules were found"
          print(f"Compiled {len(files)} prediction modules.")
          PY

      - name: Run full immutable registry and parameter binding audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_prediction_adapter_mapping_r3.py > "$RUNNER_TEMP/parameter-binding-audit.json"
          cp "$RUNNER_TEMP/parameter-binding-audit.json" prediction-parameter-binding-audit-r4.json
          cat prediction-parameter-binding-audit-r4.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("prediction-parameter-binding-audit-r4.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS_ADAPTER_MAPPING_INVENTORY", report.get("errors")
          assert report["methods"] == 1000, report
          assert report["configurations"] == 40000, report
          assert report["families"] == 20, report
          assert report["decision_counts"] == {"ALLOW_IN_PRINCIPLE": 426, "BLOCK": 574}, report
          assert report["parameter_binding_counts"].get("BOUND") == 38000, report["parameter_binding_counts"]
          assert report["parameter_binding_counts"].get("BLOCKED:SURVIVAL_EVENT_TIME_CONTRACT_NOT_IMPLEMENTED") == 2000, report["parameter_binding_counts"]
          assert "ERROR" not in report["parameter_binding_counts"], report["parameter_binding_counts"]
          assert report["empirically_eligible_methods"] == 0, report
          assert report["empirical_fitting_authorized"] is False, report
          assert report["market_data_loaded"] is False, report
          assert report["holdout_accessed"] is False, report
          print("R4 registry/parameter-binding assertions PASS; empirical fitting remains unauthorized.")
          PY

      - name: Upload sanitized audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prediction-parameter-binding-audit-r4
          path: prediction-parameter-binding-audit-r4.json
          if-no-files-found: error
          retention-days: 90
