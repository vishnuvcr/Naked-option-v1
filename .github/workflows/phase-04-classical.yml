name: Phase 4 — Classical Technical Family

on:
  push:
    branches:
      - phase-04-developer
      - developer
      - phase-04-tester
      - tester
  pull_request:
    branches:
      - developer
      - tester
  workflow_dispatch:

concurrency:
  group: phase4-classical-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn pyarrow

      - name: Restore cached research data
        uses: actions/cache@v4
        with:
          path: data/cache/raw/phase3
          key: phase4-data-${{ hashFiles('scripts/acquire_nifty_daily_history.py','scripts/discover_hf_intraday.py','scripts/acquire_hf_intraday_sample.py') }}
          restore-keys: |
            phase4-data-
            phase3-data-

      - name: Acquire daily layer when cache is absent
        run: python scripts/acquire_nifty_daily_history.py

      - name: Discover intraday reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/discover_hf_intraday.py

      - name: Acquire intraday reference when cache is absent
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_intraday_sample.py

      - name: Run Family B classical methods
        run: python scripts/run_phase4_classical.py

      - name: Validate Family B result schema
        run: python scripts/validate_phase4_classical.py

      - name: Upload Family B result packet
        uses: actions/upload-artifact@v4
        with:
          name: phase4-classical-results
          path: |
            data/reports/phase4_classical_results.json
          if-no-files-found: error
