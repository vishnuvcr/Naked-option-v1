name: Phase 7 Dhan Market Data Recovery — Guarded Single Sample

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/gates/DHAN_MARKET_DATA_SAMPLE_APPROVAL.json"
  workflow_dispatch:
    inputs:
      confirm_sample:
        description: "Request the one bounded sample (still requires exact manifest validation)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: dhan-market-data-single-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarded-sample:
    if: github.ref == 'refs/heads/phase-07-developer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-07-developer
          fetch-depth: 0
      - name: Require explicit confirmation for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_SAMPLE: ${{ inputs.confirm_sample }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_SAMPLE" != "true" ]]; then
            echo "Blocked: manual run confirmation was not selected."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regressions before any secret is available
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dhan_market_data_recovery.py
      - name: Validate exact single-use manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_dhan_sample_approval.py check
      - name: Spend manifest before any source request
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_dhan_sample_approval.py spend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gates/DHAN_MARKET_DATA_SAMPLE_APPROVAL.json
          git commit -m "Spend one-run Dhan market data sample approval"
          git push origin HEAD:phase-07-developer
      - name: Run one bounded authenticated sample
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_LIVE_SAMPLE_AUTHORIZED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dhan_market_data_recovery.py
      - name: Upload bounded sample report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-market-data-bounded-sample
          path: data/reports/dhan_market_data_sample.json
          if-no-files-found: warn
          retention-days: 30

# No order/trading endpoint is called. The secret is scoped to the final
# source step only; offline tests and manifest checks never receive it.
