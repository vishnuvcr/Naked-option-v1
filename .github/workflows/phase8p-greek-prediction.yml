name: Phase 8P Greek Prediction — Synthetic Code Gate

on:
  push:
    branches: [phase-08-prediction-developer]
    paths:
      - "scripts/phase8p_greek_prediction.py"
      - "scripts/test_phase8p_greek_prediction.py"
      - ".github/workflows/phase8p-greek-prediction.yml"
      - "research/gates/PHASE8P_GREEK_PREDICTION_SCOPE_R3_2026-10-12.md"
  workflow_dispatch:
    inputs:
      run_synthetic_tests:
        description: "Run only synthetic tests; real data access remains separately gated"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  synthetic-code-gate:
    if: ${{ github.event_name == 'push' || inputs.run_synthetic_tests == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable developer snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2

      - name: Verify exact tester-approved scope before code checks
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase-08-prediction-tester:refs/remotes/origin/phase-08-prediction-tester
          python - <<'PY'
          import json
          import subprocess
          branch = "origin/phase-08-prediction-tester"
          review_path = "research/gates/PHASE8P_GREEK_PREDICTION_SCOPE_TESTER_R3_2026-10-12.md"
          raw = subprocess.check_output(["git", "show", f"{branch}:{review_path}"], text=True)
          required = [
              "PASS — SCOPE ONLY, WITH RESTRICTIONS",
              "018500722f88f5fb100a2e24afc3d5d97394631e",
              "separate hosted preflight",
          ]
          missing = [term for term in required if term not in raw]
          if missing:
              raise SystemExit("SCOPE_GATE_BLOCKED: tester R3 scope approval mismatch: " + repr(missing))
          for path in (
              "research/gates/PHASE8P_GREEK_PREDICTION_SCOPE_R1_2026-10-12.md",
              "research/gates/PHASE8P_GREEK_PREDICTION_SCOPE_R2_2026-10-12.md",
              "research/gates/PHASE8P_GREEK_PREDICTION_SCOPE_R3_2026-10-12.md",
          ):
              subprocess.check_call(["git", "cat-file", "-e", f"HEAD:{path}"])

          # R4 is a separately approved scope amendment; it authorizes implementation only.
          duplicate_decision_path = "research/gates/PHASE8P_DUPLICATE_CONTRACT_SCOPE_DECISION_R2_2026-10-12.json"
          expected_duplicate_decision_blob = "ee9fb7e4cc2030a532b358e450ca1e4f0325d91b"
          actual_duplicate_decision_blob = subprocess.check_output(
              ["git", "rev-parse", f"{branch}:{duplicate_decision_path}"], text=True
          ).strip()
          if actual_duplicate_decision_blob != expected_duplicate_decision_blob:
              raise SystemExit("DUPLICATE_SCOPE_GATE_BLOCKED: R4 tester decision blob mismatch")
          duplicate_decision = json.loads(subprocess.check_output(
              ["git", "show", f"{branch}:{duplicate_decision_path}"], text=True
          ))
          if (duplicate_decision.get("decision") != "PASS_SCOPE_AMENDMENT_ONLY_WITH_RESTRICTIONS"
                  or duplicate_decision.get("proposal_blob_sha1") != "1ea9bca882b53fd2853829137aba2d521023b3bd"
                  or duplicate_decision.get("real_artifact_access_authorized") is not False
                  or duplicate_decision.get("model_fit_authorized") is not False):
              raise SystemExit("DUPLICATE_SCOPE_GATE_BLOCKED: R4 is not approved or scope-only flags changed")
          print("PASS: prediction R3 and duplicate-contract R4 scope approvals exist; no artifacts opened.")
          PY

      - name: Run embedded synthetic-only checks
        run: |
          set -euo pipefail
          python scripts/phase8p_greek_prediction.py --self-test | tee "${RUNNER_TEMP}/phase8p-self-test.json"
          python scripts/test_phase8p_greek_prediction.py
          sha256sum scripts/phase8p_greek_prediction.py scripts/test_phase8p_greek_prediction.py > "${RUNNER_TEMP}/phase8p-source-sha256.txt"
          cat "${RUNNER_TEMP}/phase8p-source-sha256.txt"

      - name: Upload synthetic-only gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8p-synthetic-code-gate
          path: |
            ${{ runner.temp }}/phase8p-self-test.json
            ${{ runner.temp }}/phase8p-source-sha256.txt
          if-no-files-found: warn
          retention-days: 30
