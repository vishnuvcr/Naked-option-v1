name: Phase 7 Extension 2 Gate A Source Feasibility v2

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/gates/PHASE7_EXTENSION2_SOURCE_SAMPLER_V2_APPROVAL.json"
  workflow_dispatch:
    inputs:
      run_source_sample:
        description: "Fetch the bounded Gate A samples (requires exact-snapshot tester approval)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase7-extension2-gate-a-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-fixture-regression:
    name: offline-source-schema-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline source/schema regressions only
        run: |
          python scripts/test_phase7_extension2_source_feasibility.py
          python scripts/test_phase7_extension2_source_feasibility_v2.py

  independent-tester-approval-check:
    name: fail-closed-gate-a-approval-check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_source_sample)
    needs: independent-fixture-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact-snapshot tester approval and protected hashes
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(".")
          manifest_path = root / "research/gates/PHASE7_EXTENSION2_SOURCE_SAMPLER_V2_APPROVAL.json"
          report_path = root / "research/gates/PHASE7_AVAILABLE_GLOBAL_EXTENSION2_SOURCE_SAMPLER_V2_TESTER.md"
          if not manifest_path.is_file():
              raise SystemExit("FAIL CLOSED: Gate A tester approval manifest is absent.")
          if not report_path.is_file():
              raise SystemExit("FAIL CLOSED: mirrored independent tester report is absent.")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"FAIL CLOSED: approval JSON cannot be parsed: {type(exc).__name__}")
          report_bytes = report_path.read_bytes()
          report_text = report_bytes.decode("utf-8")
          report_hash = hashlib.sha256(report_bytes).hexdigest()
          if manifest.get("decision") != "PASS WITH SCOPED RESTRICTIONS":
              raise SystemExit("FAIL CLOSED: tester decision is not PASS WITH SCOPED RESTRICTIONS.")
          required_scope = "Gate A small-sample source feasibility only; no full-history acquisition, no feature tables or labels, no model fitting, no metrics or p-values, and no final holdout access."
          if manifest.get("authorized_scope") != required_scope:
              raise SystemExit("FAIL CLOSED: authorization scope is not the registered Gate A scope.")
          required_decision_line = "**Current decision: PASS WITH SCOPED RESTRICTIONS — exact current sampler/workflow snapshot, Gate A only.**"
          if required_decision_line not in report_text:
              raise SystemExit("FAIL CLOSED: tester report does not contain the required current exact-snapshot decision line.")
          if "Full-history acquisition: NOT AUTHORIZED" not in report_text or "Model fitting: NOT AUTHORIZED" not in report_text:
              raise SystemExit("FAIL CLOSED: tester report does not explicitly restrict execution to Gate A.")
          if manifest.get("tester_report_sha256") != report_hash:
              raise SystemExit("FAIL CLOSED: mirrored tester report SHA-256 mismatch.")
          expected = {
              "research/phase7/AVAILABLE_DATA_PREDICTION_EXTENSION_2_SPEC.md",
              "scripts/phase7_extension2_source_feasibility.py",
              "scripts/test_phase7_extension2_source_feasibility.py",
              "scripts/phase7_extension2_source_feasibility_v2.py",
              "scripts/test_phase7_extension2_source_feasibility_v2.py",
              ".github/workflows/phase-07-extension2-source-feasibility-v2.yml",
          }
          approved = manifest.get("protected_file_sha256")
          approved_blobs = manifest.get("protected_git_blob_sha")
          if not isinstance(approved, dict) or set(approved) != expected:
              raise SystemExit("FAIL CLOSED: protected-file SHA-256 allowlist is missing, extra or mismatched.")
          if not isinstance(approved_blobs, dict) or set(approved_blobs) != expected:
              raise SystemExit("FAIL CLOSED: protected Git-blob allowlist is missing, extra or mismatched.")
          for rel in sorted(expected):
              file_path = root / rel
              if not file_path.is_file():
                  raise SystemExit(f"FAIL CLOSED: protected path missing: {rel}")
              actual = hashlib.sha256(file_path.read_bytes()).hexdigest()
              if actual != approved[rel]:
                  raise SystemExit(f"FAIL CLOSED: SHA-256 mismatch for {rel}")
              actual_blob = subprocess.check_output(["git", "rev-parse", f"HEAD:{rel}"], text=True).strip()
              if actual_blob != approved_blobs[rel]:
                  raise SystemExit(f"FAIL CLOSED: Git-blob mismatch for {rel}")
              if actual_blob not in report_text:
                  raise SystemExit(f"FAIL CLOSED: tester report does not mention reviewed blob for {rel}")
          reviewed_commit = manifest.get("reviewed_developer_commit")
          if not isinstance(reviewed_commit, str) or len(reviewed_commit) != 40:
              raise SystemExit("FAIL CLOSED: reviewed developer commit is malformed.")
          subprocess.run(["git", "cat-file", "-e", f"{reviewed_commit}^{{commit}}"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", reviewed_commit, "HEAD"], check=True)
          print("PASS: exact-snapshot tester report, scope, ancestry, path set and hashes verified.")
          print("authorized=true")
          PY
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  bounded-source-feasibility-only:
    name: bounded-source-feasibility-only
    needs: [independent-fixture-regression, independent-tester-approval-check]
    if: needs.independent-tester-approval-check.result == 'success' && needs.independent-tester-approval-check.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch only registered Gate A samples
        run: python scripts/phase7_extension2_source_feasibility_v2.py
      - name: Upload bounded feasibility report
        uses: actions/upload-artifact@v4
        with:
          name: phase7-extension2-gate-a-source-feasibility-v2
          path: data/reports/extension2_gate_a_source_feasibility_v2.json
          if-no-files-found: error
          retention-days: 30
