name: Phase 8P R3 PM0001 executor synthetic gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/prediction_pm0001_executor_r3.py"
      - "scripts/test_prediction_pm0001_executor_r3.py"
      - "scripts/prediction_logistic_adapter_r3.py"
      - "scripts/prediction_logistic_calibration_r3.py"
      - ".github/workflows/phase-08p-r3-pm0001-executor-synthetic.yml"

permissions:
  contents: read

concurrency:
  group: phase-08p-r3-pm0001-executor-synthetic
  cancel-in-progress: false

jobs:
  pm0001-synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Compile PM0001 executor
        run: python -m py_compile scripts/prediction_pm0001_executor_r3.py
      - name: Run synthetic-only PM0001 executor tests
        working-directory: scripts
        run: python -m unittest test_prediction_pm0001_executor_r3.py -v
      - name: Assert the test module contains no market-data or holdout loading
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path("scripts/test_prediction_pm0001_executor_r3.py").read_text()
          assert "read_csv(" not in test
          assert "merged.csv.gz" not in test
          print("SYNTHETIC_ONLY: test data are generated in memory; no market-data artifact or holdout is loaded")
          PY
