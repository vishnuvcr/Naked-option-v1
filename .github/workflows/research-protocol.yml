name: Research Protocol Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - developer
      - tester
      - phase-*
  pull_request:
    branches:
      - main
      - developer
      - tester

jobs:
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contract
        run: python scripts/validate_protocol.py
      - name: Validate literature registry
        run: python scripts/validate_literature_registry.py

  phase6-change:
    name: detect-phase6-change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_phase6: ${{ steps.detect.outputs.run_phase6 }}
      empirical_authorized: ${{ steps.detect.outputs.empirical_authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          run_phase6=false
          empirical_authorized=false
          ref="${GITHUB_REF}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="refs/heads/${{ github.event.pull_request.head.ref }}"
          fi
          if [ "${ref}" = "refs/heads/phase-06-developer" ]; then
            if [ -f "research/gates/PHASE6_CODE_APPROVAL_TESTER.md" ]; then
              empirical_authorized=true
            fi
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              run_phase6=true
            else
              before="${{ github.event.before }}"
              if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
                before="${GITHUB_SHA}^"
              fi
              changed="$(git diff --name-only "${before}" "${GITHUB_SHA}" || true)"
              while IFS= read -r f; do
                case "${f}" in
                  scripts/run_phase6_novel.py|scripts/test_phase6_novel.py|research/phase6/*|.github/workflows/phase-06-novel.yml|research/gates/PHASE6_CODE_APPROVAL_TESTER.md)
                    run_phase6=true
                    ;;
                esac
              done <<< "${changed}"
            fi
          fi
          echo "run_phase6=${run_phase6}" >> "${GITHUB_OUTPUT}"
          echo "empirical_authorized=${empirical_authorized}" >> "${GITHUB_OUTPUT}"

  phase6:
    name: phase6-novel-gated
    needs: phase6-change
    if: ${{ needs.phase6-change.outputs.run_phase6 == 'true' }}
    uses: ./.github/workflows/phase-06-novel.yml
    with:
      empirical_authorized: ${{ needs.phase6-change.outputs.empirical_authorized == 'true' }}
    secrets: inherit

  phase7-run925-independent-audit:
    name: phase7-run925-independent-artifact-audit
    if: ${{ github.ref == 'refs/heads/phase-07-tester' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout independent tester code
        uses: actions/checkout@v4

      - name: Checkout immutable empirical source snapshot
        uses: actions/checkout@v4
        with:
          ref: 682eadf2a9eb4de250bc3db27d02e57f88687fa1
          path: source_snapshot
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Install pinned audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.6 pandas==3.0.6 scikit-learn==1.9.1 scipy==1.17.1 pyarrow==26.0.0 threadpoolctl==3.7.0

      - name: Acquire source snapshot data with same acquisition code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python source_snapshot/scripts/acquire_nifty_daily_history.py
          python source_snapshot/scripts/acquire_hf_intraday_sample.py

      - name: Download immutable Run 925 reference artifact
        uses: actions/download-artifact@v4
        with:
          name: phase7-ensemble-reference
          run-id: 37914905848
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit_artifacts/reference

      - name: Download immutable Run 925 aggregate results
        uses: actions/download-artifact@v4
        with:
          name: phase7-ensemble-results
          run-id: 37914905848
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit_artifacts/results

      - name: Audit hashes, source alignment and all metrics independently
        run: |
          python scripts/audit_phase7_run925_artifact.py \
            --artifact-root audit_artifacts/reference \
            --results-root audit_artifacts/results \
            --source-root source_snapshot \
            --expected-run-id 37914905848 \
            --expected-commit 682eadf2a9eb4de250bc3db27d02e57f88687fa1 \
            --report audit_out/phase7_run925_audit.json

      - name: Preserve independent audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-run925-independent-audit
          path: audit_out/phase7_run925_audit.json
          if-no-files-found: warn
