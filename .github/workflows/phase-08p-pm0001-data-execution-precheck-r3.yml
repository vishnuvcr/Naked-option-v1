name: Phase 8P R3 PM0001 data execution precheck

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: phase-08p-research-writer
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn -r requirements-composite.txt
      - name: Compile and run all synthetic gates before data retrieval
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_pm0001_data_execution_precheck_r3.py scripts/create_pm0001_execution_gate_r3.py scripts/run_pm0001_prediction_sweep_r3.py scripts/freeze_pm0001_result_bundle_r3.py scripts/prediction_features_r3.py scripts/prediction_pm0001_executor_r3.py scripts/prediction_logistic_adapter_r3.py scripts/prediction_logistic_calibration_r3.py scripts/prediction_statistics.py scripts/prediction_walkforward_r3.py scripts/validate_prediction_feature_contract_r3.py scripts/publish_pm0001_run_status_r3.py
          python -m unittest discover -s scripts -p 'test_prediction_features_r3.py' -v
          python -m unittest discover -s scripts -p 'test_create_pm0001_execution_gate_r3.py' -v
          python -m unittest discover -s scripts -p 'test_run_pm0001_prediction_sweep_r3.py' -v
          python -m unittest discover -s scripts -p 'test_freeze_pm0001_result_bundle_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_pm0001_executor_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_logistic_calibration_r3.py' -v
          python -m unittest discover -s scripts -p 'test_prediction_walkforward_r3.py' -v
          python -m unittest discover -s scripts -p 'test_pm0001_data_execution_precheck_r3.py' -v
          python -m unittest discover -s scripts -p 'test_publish_pm0001_run_status_r3.py' -v
      - name: Verify PM0001 implementation gate and eligibility pins
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(".")
          gate=json.loads((root/"research/gates/PREDICTION_PM0001_IMPLEMENTATION_GATE_R3_2026-10-14.json").read_text())
          assert gate["status"] == "PASS_SYNTHETIC_DEVELOPER_TESTED_ONLY"
          for p, expected in gate["source_blob_pins"].items():
              raw=(root/p).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert actual == expected, f"stale implementation pin: {p}"
          eligibility=json.loads((root/"research/gates/PREDICTION_ELIGIBILITY_DISPOSITION_R3_2026-10-13.json").read_text())
          assert eligibility["record_count"] == 40000
          assert eligibility["empirical_fit_authorized"] is False
          assert eligibility["disposition_counts"]["ELIGIBLE_PENDING_EXECUTOR_GATE"] == 40
          assert eligibility["implementation_gate_status"] == gate["status"]
          print("PM0001 implementation and 40-config eligibility pins verified; empirical fitting still unauthorized.")
          PY
      - name: Download, verify, and temporarily decrypt canonical data
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r3-pm0001-precheck"
          mkdir -p "$WORK/unpacked" "$WORK/plain-parts"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11698879857" -o "$WORK/artifact-metadata.json"
          python - "$WORK/artifact-metadata.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          actual={k:x.get(k) for k in ("id","expired","digest","size_in_bytes","created_at","expires_at","name")}
          print(json.dumps(actual,sort_keys=True))
          expected={"id":11698879857,"expired":False,"digest":"sha256:40f3e54472d47cd8e6c4eb17d3a6b302fcf3059a0ab395695d4d3c6c3e5bb45b","size_in_bytes":231076122}
          for key,value in expected.items():
              if actual.get(key)!=value:
                  raise SystemExit(f"PINNED_SOURCE_ARTIFACT_METADATA_MISMATCH:{key}:expected={value!r}:actual={actual.get(key)!r}")
          PY
          # GitHub CLI follows the API's temporary signed-URL redirect without exposing the token in shell output.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11698879857/zip" > "$WORK/source.zip"
          echo "40f3e54472d47cd8e6c4eb17d3a6b302fcf3059a0ab395695d4d3c6c3e5bb45b  $WORK/source.zip" | sha256sum -c -
          unzip -q "$WORK/source.zip" -d "$WORK/unpacked"
          MANIFEST="$(find "$WORK/unpacked" -type f -name dataset_manifest.json -print -quit)"
          test -n "$MANIFEST"
          BUNDLE="$(dirname "$MANIFEST")"
          python scripts/validate_phase8_cached_composite_bundle.py --bundle-dir "$BUNDLE" --reference-manifest research/data/DERIVED_DATASET_MANIFEST_R2_RUN_38126168547.json --output research/gates/PREDICTION_ENCRYPTED_BUNDLE_PREFLIGHT_R3_2026-10-13.json
          python scripts/decrypt_nifty_1m_composite.py --input-dir "$BUNDLE" --output-dir "$WORK/plain-parts" --merge-output "$WORK/merged.csv.gz"
          python scripts/preflight_prediction_dataset_r3.py \
            --merged-gzip "$WORK/merged.csv.gz" \
            --calendar research/data/NSE_CAPITAL_MARKET_SESSION_CALENDAR_R3_2026-10-13.json \
            --preregistration research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json \
            --preprocessing-rules research/data/PREDICTION_DATA_PREPROCESSING_RULES_R3_2026-10-13.json \
            --output research/gates/PREDICTION_DATA_PREFLIGHT_R3_2026-10-13.json
          echo "MERGED_GZIP=$WORK/merged.csv.gz" >> "$GITHUB_ENV"
      - name: Run full canonical hash and 320 config-fold prechecks (no fitting)
        env:
          MERGED_GZIP: ${{ env.MERGED_GZIP }}
        run: python scripts/run_pm0001_data_execution_precheck_r3.py --merged-gzip "$MERGED_GZIP" --output research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json
      - name: Build run-scoped PM0001 execution gate
        run: |
          set -euo pipefail
          python scripts/create_pm0001_execution_gate_r3.py \
            --preflight research/gates/PREDICTION_DATA_PREFLIGHT_R3_2026-10-13.json \
            --precheck-report research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json \
            --feature-report research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json \
            --runner scripts/run_pm0001_prediction_sweep_r3.py \
            --output research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_2026-10-14.json \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Run authorized PM0001 prediction sweep
        env:
          MERGED_GZIP: ${{ env.MERGED_GZIP }}
        run: |
          set -euo pipefail
          mkdir -p research/results
          python scripts/run_pm0001_prediction_sweep_r3.py \
            --merged-gzip "$MERGED_GZIP" \
            --precheck-report research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json \
            --preflight-report research/gates/PREDICTION_DATA_PREFLIGHT_R3_2026-10-13.json \
            --execution-gate research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_2026-10-14.json \
            --output research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.json \
            --summary research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.summary.json \
            --errors research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.errors.jsonl \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Validate and hash-freeze result bundle
        run: |
          set -euo pipefail
          python scripts/freeze_pm0001_result_bundle_r3.py \
            --result-bundle research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.json \
            --summary research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.summary.json \
            --errors research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.errors.jsonl \
            --precheck-report research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json \
            --execution-gate research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_2026-10-14.json \
            --csv research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.csv \
            --report-markdown research/results/PM0001_PREDICTION_RESULTS_R3_2026-10-14.md \
            --manifest research/results/PM0001_PREDICTION_RESULT_MANIFEST_R3_2026-10-14.json \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Upload aggregate-only results and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm0001-prediction-result-bundle-r3
          path: |
            research/gates/PREDICTION_ENCRYPTED_BUNDLE_PREFLIGHT_R3_2026-10-13.json
            research/gates/PREDICTION_DATA_PREFLIGHT_R3_2026-10-13.json
            research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json
            research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_2026-10-14.json
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.json
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.summary.json
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.errors.jsonl
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.csv
            research/results/PM0001_PREDICTION_RESULTS_R3_2026-10-14.md
            research/results/PM0001_PREDICTION_RESULT_MANIFEST_R3_2026-10-14.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit aggregate results, status, and diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_pm0001_run_status_r3.py --job-status "$JOB_STATUS"
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          for p in \
            README.md research/STATUS.md research/ERROR_LOG.md \
            research/logs/ERROR_LOG.md research/logs/RESEARCH_LOG.md research/logs/CHAT_LOG.md \
            research/gates/PREDICTION_ENCRYPTED_BUNDLE_PREFLIGHT_R3_2026-10-13.json \
            research/gates/PREDICTION_DATA_PREFLIGHT_R3_2026-10-13.json \
            research/gates/PREDICTION_PM0001_DATA_EXECUTION_PRECHECK_R3_2026-10-14.json \
            research/gates/PREDICTION_PM0001_EXECUTION_GATE_R3_2026-10-14.json \
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.json \
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.summary.json \
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.errors.jsonl \
            research/results/PM0001_PREDICTION_SWEEP_R3_2026-10-14.csv \
            research/results/PM0001_PREDICTION_RESULTS_R3_2026-10-14.md \
            research/results/PM0001_PREDICTION_RESULT_MANIFEST_R3_2026-10-14.json \
            research/gates/attempts/PM0001_PREDICTION_SWEEP_R3_RUN_"$GITHUB_RUN_ID"_partial.json \
            research/gates/attempts/PM0001_PREDICTION_SWEEP_R3_RUN_"$GITHUB_RUN_ID"_unfrozen.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No new result/status artifacts to commit."
            exit 0
          fi
          git commit -m "Record PM0001 prediction run $GITHUB_RUN_ID outcomes"
          git push origin HEAD:phase-08-prediction-developer
      - name: Submit frozen acquired results to independent tester
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest_path=Path("research/results/PM0001_PREDICTION_RESULT_MANIFEST_R3_2026-10-14.json")
          if not manifest_path.is_file():
              print("No frozen result manifest; independent results review is not yet eligible.")
              raise SystemExit(0)
          manifest=json.loads(manifest_path.read_text())
          if manifest.get("results_acquired") is not True:
              print("No empirical results acquired; preserve blocked terminal accounting without promotion.")
              raise SystemExit(0)
          tested_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          source_paths=[
              "scripts/create_pm0001_execution_gate_r3.py",
              "scripts/run_pm0001_data_execution_precheck_r3.py",
              "scripts/run_pm0001_prediction_sweep_r3.py",
              "scripts/freeze_pm0001_result_bundle_r3.py",
              "scripts/prediction_features_r3.py",
              "scripts/prediction_pm0001_executor_r3.py",
              "scripts/prediction_logistic_adapter_r3.py",
              "scripts/prediction_logistic_calibration_r3.py",
              "scripts/prediction_statistics.py",
              "scripts/prediction_walkforward_r3.py",
              "research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json",
              "research/registry/PREDICTION_LABEL_MANIFEST_R3_2026-10-13.json",
              "research/registry/PREDICTION_FEATURE_CONSTRUCTION_CORRECTION_R3A_2026-10-14.json",
              "research/gates/PREDICTION_FEATURE_CONSTRUCTION_TEST_REPORT_R3A_2026-10-14.json",
          ]
          changed={p:subprocess.check_output(["git","rev-parse",f"{tested_commit}:{p}"],text=True).strip() for p in source_paths}
          request={
              "schema_version":"prediction-results-acquired-review-request-r3-v1",
              "created_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "results_acquired":True,
              "tested_source_commit":tested_commit,
              "result_bundle_manifest_path":manifest_path.as_posix(),
              "result_bundle_manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "source_execution_commit":manifest.get("source_commit"),
              "source_workflow_run_id":manifest.get("workflow_run_id"),
              "changed_source_blobs":changed,
              "handoff_note":"Developer-side data/source gates and synthetic suites completed. Independently verify the full frozen 40-config x 8-fold bundle, all metrics and blocked/failed outcomes. Do not select a strategy or advance phase before the tester report."
          }
          out=Path("research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json")
          out.write_text(json.dumps(request,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"results_acquired":True,"tested_source_commit":tested_commit,"manifest_sha256":request["result_bundle_manifest_sha256"],"source_blob_count":len(changed)},sort_keys=True))
          PY
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          git add research/gates/PREDICTION_RESULTS_ACQUIRED_REVIEW_REQUEST.json
          git commit -m "Request independent review of frozen PM0001 prediction results"
          git push origin HEAD:phase-08-prediction-developer
      - name: Remove plaintext and temporary source bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/r3-pm0001-precheck"
