name: Phase 8 Independent Greek Enrichment Tester

on:
  push:
    branches: [phase-08-tester]
    paths:
      - "research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_REQUEST_R1_2026-10-12.json"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  independent-audit:
    name: Audit exact developer snapshot in isolated checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tester environment
        uses: actions/checkout@v4
        with:
          ref: phase-08-tester
          fetch-depth: 0

      - name: Install numeric test dependencies
        run: python -m pip install --upgrade numpy pandas scipy pyarrow cryptography

      - name: Fetch developer role branch
        run: git fetch --no-tags origin phase-08-developer:refs/remotes/origin/phase-08-developer

      - name: Validate requested developer snapshot and exact blob hashes
        id: pins
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, pathlib, subprocess
          request_path="research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_REQUEST_R1_2026-10-12.json"
          req=json.loads(pathlib.Path(request_path).read_text())
          sha=req["developer_snapshot_sha"]
          errors=[]
          if sha != req.get("developer_snapshot_sha"):
              errors.append("dispatch snapshot differs from approved request snapshot")
          try: subprocess.check_output(["git","cat-file","-e",sha+"^{commit}"],stderr=subprocess.STDOUT)
          except Exception: errors.append("developer commit object not available")
          expected=req.get("reviewed_blobs",{})
          required={
              "scripts/enrich_nifty_composite_greeks.py",
              "scripts/test_enrich_nifty_composite_greeks.py",
              ".github/workflows/phase8-greek-enrichment.yml",
              "research/gates/PHASE8_GREEK_ENRICHMENT_SCOPE_REQUEST_R1_2026-10-12.md",
          }
          if set(expected) != required: errors.append("reviewed_blobs set does not equal required four files")
          if not errors:
              for path,digest in expected.items():
                  try:
                      actual=subprocess.check_output(["git","rev-parse",f"{sha}:{path}"],text=True).strip()
                      if actual!=digest: errors.append("blob hash mismatch: "+path)
                  except Exception: errors.append("missing blob: "+path)
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"DEV_SNAPSHOT_SHA={sha}\n")
              f.write("PIN_CHECK_STATUS="+("PASS" if not errors else "FAIL")+"\n")
              f.write("PIN_CHECK_ERRORS="+(" ; ".join(errors).replace("%","%25").replace("\n"," ") or "none")+"\n")
              f.write("DEV_ROOT="+os.path.join(os.environ["RUNNER_TEMP"],"devsnapshot")+"\n")
          print(json.dumps({"snapshot":sha,"pin_status":"PASS" if not errors else "FAIL","errors":errors},sort_keys=True))
          PY

      - name: Create isolated read-only worktree
        if: always()
        run: |
          if [ "$PIN_CHECK_STATUS" = "PASS" ]; then
            git worktree add --detach "$DEV_ROOT" "$DEV_SNAPSHOT_SHA"
          else
            mkdir -p "$DEV_ROOT"
          fi

      - name: Run developer synthetic suite
        id: developer_tests
        if: env.PIN_CHECK_STATUS == 'PASS'
        shell: bash
        run: |
          set +e
          cd "$DEV_ROOT"
          python scripts/test_enrich_nifty_composite_greeks.py > "$RUNNER_TEMP/developer-suite.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/developer-suite.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "DEV_TEST_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Run independently authored formula and finite-difference audit
        id: independent_tests
        if: env.PIN_CHECK_STATUS == 'PASS'
        shell: bash
        run: |
          set +e
          python "$GITHUB_WORKSPACE/scripts/phase8_greek_independent_audit.py" "$DEV_ROOT" > "$RUNNER_TEMP/independent-audit.json" 2> "$RUNNER_TEMP/independent-audit.log"
          rc=$?
          cat "$RUNNER_TEMP/independent-audit.json" 2>/dev/null || true
          cat "$RUNNER_TEMP/independent-audit.log" 2>/dev/null || true
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "INDEPENDENT_TEST_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Write machine decision and review report
        if: always()
        env:
          DEVELOPER_SUITE_OUTCOME: ${{ steps.developer_tests.outputs.exit_code }}
          INDEPENDENT_SUITE_OUTCOME: ${{ steps.independent_tests.outputs.exit_code }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          req=json.loads((root/"research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_REQUEST_R1_2026-10-12.json").read_text())
          pin=os.environ.get("PIN_CHECK_STATUS","FAIL")
          dev_rc=os.environ.get("DEV_TEST_RC",os.environ.get("DEVELOPER_SUITE_OUTCOME",""))
          ind_rc=os.environ.get("INDEPENDENT_TEST_RC",os.environ.get("INDEPENDENT_SUITE_OUTCOME",""))
          ok=pin=="PASS" and dev_rc=="0" and ind_rc=="0"
          decision="PASS_WITH_SCOPED_RESTRICTIONS" if ok else "REQUEST_CHANGES"
          decision_path=root/"research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_DECISION_R1_2026-10-12.json"
          report_path=root/"research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_REVIEW_R1_2026-10-12.md"
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          dev_log=tmp/"developer-suite.log"
          ind_json=tmp/"independent-audit.json"
          ind_log=tmp/"independent-audit.log"
          ind_result={}
          if ind_json.exists():
              try: ind_result=json.loads(ind_json.read_text())
              except Exception: ind_result={"parse_error":True}
          findings=[]
          if pin!="PASS": findings.append("Exact source blob or developer commit pin check failed: "+os.environ.get("PIN_CHECK_ERRORS","unspecified"))
          if dev_rc!="0": findings.append("Developer synthetic suite did not pass; inspect retained log.")
          if ind_rc!="0": findings.append("Independent formula audit did not pass; inspect retained log.")
          sha=req["developer_snapshot_sha"]
          payload={
              "schema_version":1,
              "gate":"PHASE8_GREEK_ENRICHMENT_R1",
              "reviewed_at_utc":datetime.now(timezone.utc).isoformat(),
              "decision":decision,
              "developer_snapshot_sha":sha,
              "approved_scope":"HF_PUBLIC_EXPIRY_FILELIST_AND_NIFTY_SPOT_ENRICHMENT_OF_CACHED_ENCRYPTED_COMPOSITE" if ok else "NONE",
              "hf_public_spot_fetch_authorized":bool(ok),
              "hf_public_expiry_filelist_authorized":bool(ok),
              "dhan_api_requests_authorized":False,
              "empirical_option_pnl_authorized":False,
              "holdout_access_authorized":False,
              "strategy_promotion_authorized":False,
              "plaintext_upload_authorized":False,
              "commercial_use_authorized":False,
              "reviewed_blobs":req["reviewed_blobs"],
              "tester_workflow_run_id":os.environ.get("WORKFLOW_RUN_ID",""),
              "pin_check_status":pin,
              "developer_suite_exit_code":dev_rc,
              "independent_suite_exit_code":ind_rc,
              "independent_test_summary":ind_result,
              "findings":findings,
              "limitations":[
                  "This gate only covers HF public expiry-filelist plus exact-timestamp NIFTY spot enrichment of the cached partial grid.",
                  "It does not establish complete exchange-listed strike coverage or official point-in-time expiry master validation.",
                  "Greeks are model estimates with zero-rate and zero-dividend proxies and IV inversion/labelled fallback, not historical vendor-observed Greeks.",
                  "The HF source licence is CC-BY-NC-4.0; non-commercial research only.",
                  "No Dhan request, option P&L, holdout, strategy promotion or plaintext artifact publication is permitted."
              ]
          }
          decision_path.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          dev_summary=dev_log.read_text(errors="replace").strip()[-4000:] if dev_log.exists() else "Not executed."
          ind_summary=ind_json.read_text(errors="replace").strip() if ind_json.exists() else (ind_log.read_text(errors="replace").strip()[-4000:] if ind_log.exists() else "Not executed.")
          report=f"""# Independent tester review — Phase 8 Greek enrichment R1

Decision: **{decision}**

Exact developer snapshot: {sha}

Tester workflow run: {os.environ.get("WORKFLOW_RUN_ID","")}

Pin check: {pin}

Developer synthetic suite exit: {dev_rc or "not executed"}

Independent formula audit exit: {ind_rc or "not executed"}

## Scope reviewed

The tester checked the exact source blobs for enrichment implementation, developer synthetic suite, hosted workflow, and scope request. External data access must remain blocked unless this machine decision matches the exact commit and blob hashes.

## Findings

{chr(10).join("- "+x for x in findings) if findings else "- No mathematical or synthetic integrity blocker was detected within this limited gate."}

## Developer test output

{dev_summary}

## Independent test output

{ind_summary}

## Restrictions

- No Dhan requests, option P&L, holdout access, strategy promotion or plaintext artifact upload is authorized.
- The source is a partial rolling strike grid and not every exchange-listed NIFTY option.
- Expiry comes from published HF expiry partitions plus a separately labelled Tuesday-rule proxy; this is not a complete point-in-time contract master.
- IV is inverted from option close where valid; a source IV fallback uses the prior documented unit heuristic.
- Zero rate and zero dividend are disclosed proxies. Greeks must be labelled model estimates.
- Hugging Face source licence CC-BY-NC-4.0 restricts this output to non-commercial research.

**Developer → Tester:** this decision applies only to the exact commit and blobs above; any code change needs another review.

**Tester → Developer:** {("proceed with narrowly scoped HF enrichment and keep all execution/strategy gates blocked." if ok else "repair the findings and submit a new exact-snapshot tester request; do not retrieve market data.")}
"""
          report_path.write_text(report)
          PY

      - name: Commit tester-owned decision and report to tester branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_REVIEW_R1_2026-10-12.md research/gates/PHASE8_GREEK_ENRICHMENT_TESTER_DECISION_R1_2026-10-12.json
          git commit -m "Record Phase 8 Greek enrichment tester decision R1"
          git push origin HEAD:phase-08-tester

      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-greek-enrichment-independent-tester-r1
          path: |
            ${{ runner.temp }}/developer-suite.log
            ${{ runner.temp }}/independent-audit.json
            ${{ runner.temp }}/independent-audit.log
          if-no-files-found: warn
          retention-days: 30
