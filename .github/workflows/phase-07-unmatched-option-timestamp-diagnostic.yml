name: Phase 7 Unmatched Option Timestamps — Offline Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-07-unmatched-option-timestamp-diagnostic.yml"
      - "scripts/diagnose_nifty_1m_value_anomalies.py"
      - "scripts/test_diagnose_nifty_1m_value_anomalies.py"
  workflow_dispatch:
    inputs:
      patch_run_id:
        description: "Completed patch run whose encrypted artifact should be analyzed."
        required: true
        type: string
        default: "38126168547"

permissions:
  actions: read
  contents: write

concurrency:
  group: phase-07-unmatched-option-timestamp-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_PATCH_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_run_id || '38126168547' }}
    steps:
      - name: Checkout diagnostic code and publication branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Validate diagnostic workflow YAML
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/phase-07-unmatched-option-timestamp-diagnostic.yml"); puts "PASS unmatched timestamp diagnostic workflow YAML parses"'

      - name: Validate exact patch run and its artifact
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_PATCH_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid patch run ID."; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_PATCH_RUN_ID")"
          name="$(jq -r '.name // ""' <<< "$run_json")"
          branch="$(jq -r '.head_branch // ""' <<< "$run_json")"
          status="$(jq -r '.status // ""' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
          if [[ "$name" != "Phase 7 NIFTY Spot Failed-Window Patch — Exact-SHA Gate" ||
                "$branch" != "phase-07-tester" || "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "Refusing non-patch, wrong-branch, incomplete or failed source run."
            exit 1
          fi
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_PATCH_RUN_ID/artifacts?per_page=100")"
          expected_name="nifty-1m-spot-failed-window-patch-$TARGET_PATCH_RUN_ID"
          count="$(jq --arg n "$expected_name" '[.artifacts[] | select(.name == $n and .expired == false and .size_in_bytes > 0)] | length' <<< "$artifacts")"
          [[ "$count" == "1" ]] || { echo "Expected exactly one nonempty encrypted patch artifact; found $count."; exit 1; }
          echo "audit_ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.audit_ready == 'true'
        with:
          python-version: "3.12"

      - name: Install pinned encryption dependency
        if: steps.preflight.outputs.audit_ready == 'true'
        run: python -m pip install -r requirements-composite.txt

      - name: Run offline diagnostic unit tests
        if: steps.preflight.outputs.audit_ready == 'true'
        run: |
          set -euo pipefail
          python -m py_compile scripts/diagnose_nifty_1m_unmatched_spot_targets.py scripts/test_diagnose_nifty_1m_unmatched_spot_targets.py
          python scripts/test_diagnose_nifty_1m_unmatched_spot_targets.py

      - name: Download exact encrypted patch artifact
        if: steps.preflight.outputs.audit_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nifty-1m-spot-failed-window-patch-${{ env.TARGET_PATCH_RUN_ID }}
          run-id: ${{ env.TARGET_PATCH_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/unmatched-spot-bundle

      - name: Verify encrypted part hashes and prepare decrypt input
        if: steps.preflight.outputs.audit_ready == 'true'
        env:
          BUNDLE_DIR: ${{ runner.temp }}/unmatched-spot-bundle
          INPUT_DIR: ${{ runner.temp }}/unmatched-spot-input
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          bundle=pathlib.Path(os.environ["BUNDLE_DIR"])
          manifests=list(bundle.rglob("dataset_manifest.json"))
          if len(manifests)!=1:
              raise SystemExit("patch_dataset_manifest_count_invalid")
          export_root=manifests[0].parent
          manifest=json.loads(manifests[0].read_text(encoding="utf-8"))
          if manifest.get("download_bundle_contains_encrypted_data_only") is not True:
              raise SystemExit("patch_plaintext_scope_marker_invalid")
          if manifest.get("dataset_id")!="NIFTY_1M_DHAN_ROLLING_OPTIONS_COMPOSITE_2021-10-11_2026-10-10_SPOT_GAPFILL":
              raise SystemExit("patch_dataset_id_mismatch")
          expected_options, expected_spot=8490723,509142
          if manifest.get("source_row_count_options")!=expected_options or manifest.get("source_row_count_spot")!=expected_spot:
              raise SystemExit("patch_manifest_row_count_mismatch")
          summary=manifest.get("dataset_summary",{})
          if summary.get("rows_options")!=expected_options or summary.get("rows_spot")!=expected_spot:
              raise SystemExit("patch_manifest_summary_mismatch")
          parts=manifest.get("parts")
          if not isinstance(parts,list) or not parts:
              raise SystemExit("patch_encrypted_parts_missing")
          encrypted_root=export_root/"encrypted"
          if not encrypted_root.is_dir():
              raise SystemExit("patch_encrypted_directory_missing")
          declared_names=set()
          total_rows=0
          for part in parts:
              name=part.get("file","")
              if not name or pathlib.Path(name).name!=name or not name.endswith(".csv.gz.enc"):
                  raise SystemExit("unsafe_patch_part_name")
              declared_names.add(name)
              path=encrypted_root/name
              if not path.is_file() or path.stat().st_size!=int(part.get("encrypted_bytes",-1)):
                  raise SystemExit("patch_encrypted_part_size_mismatch")
              digest=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      digest.update(chunk)
              if digest.hexdigest()!=part.get("encrypted_sha256"):
                  raise SystemExit("patch_encrypted_part_sha256_mismatch")
              total_rows+=int(part.get("row_count",-1))
          actual_names={p.name for p in encrypted_root.glob("*.csv.gz.enc") if p.is_file()}
          if actual_names!=declared_names:
              raise SystemExit("patch_encrypted_part_set_mismatch")
          if total_rows!=expected_options+expected_spot:
              raise SystemExit("patch_manifest_part_row_sum_mismatch")
          coverage_path=export_root/"coverage_and_errors.json"
          if not coverage_path.is_file():
              raise SystemExit("patch_coverage_report_missing")
          coverage=json.loads(coverage_path.read_text(encoding="utf-8"))
          if coverage.get("base_partial_artifact_id")!="11697215166":
              raise SystemExit("patch_base_lineage_id_mismatch")
          safe_results=list(bundle.rglob("NIFTY_1M_SPOT_FAILED_WINDOW_PATCH_RESULT.json"))
          if len(safe_results)!=1:
              raise SystemExit("patch_safe_result_count_invalid")
          safe=json.loads(safe_results[0].read_text(encoding="utf-8"))
          if safe.get("base_partial_artifact_sha256")!="07e402f194a42421a1d3df6a3a8b3031c30352250ff110b085e984816405d26a":
              raise SystemExit("patch_base_lineage_hash_mismatch")
          if safe.get("live_option_requests_allowed") is not False or safe.get("model_fitting_authorized") is not False:
              raise SystemExit("patch_permission_flags_invalid")
          input_dir=pathlib.Path(os.environ["INPUT_DIR"])
          input_dir.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(manifests[0],input_dir/"dataset_manifest.json")
          for name in declared_names:
              (input_dir/name).symlink_to(encrypted_root/name)
          print(json.dumps({"preflight":"PASS","encrypted_part_count":len(parts),"option_rows":expected_options,"spot_rows":expected_spot,"manifest_row_sum":total_rows,"market_values_printed":False},sort_keys=True))
          PY

      - name: Decrypt authenticated parts locally
        if: steps.preflight.outputs.audit_ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_DIR: ${{ runner.temp }}/unmatched-spot-input
          PLAIN_DIR: ${{ runner.temp }}/unmatched-spot-plain
        run: |
          set -euo pipefail
          [[ -n "$HF_TOKEN" ]] || { echo "HF_TOKEN is unavailable."; exit 1; }
          python scripts/decrypt_nifty_1m_composite.py --input-dir "$INPUT_DIR" --output-dir "$PLAIN_DIR"
          cp "$INPUT_DIR/dataset_manifest.json" "$PLAIN_DIR/dataset_manifest.json"

      - name: Map all unmatched option timestamps by session date
        id: diagnostic
        if: steps.preflight.outputs.audit_ready == 'true'
        env:
          PLAIN_DIR: ${{ runner.temp }}/unmatched-spot-plain
          OUTPUT_JSON: ${{ github.workspace }}/research/data/UNMATCHED_OPTION_TIMESTAMP_DISTRIBUTION_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
        run: |
          set -euo pipefail
          python scripts/diagnose_nifty_1m_unmatched_spot_targets.py --input-dir "$PLAIN_DIR" --output-json "$OUTPUT_JSON"

      - name: Diagnose OHLC and volume anomalies by provenance
        id: value_diagnostic
        if: steps.diagnostic.outcome == 'success'
        env:
          PLAIN_DIR: ${{ runner.temp }}/unmatched-spot-plain
          OUTPUT_JSON: ${{ github.workspace }}/research/data/VALUE_ANOMALY_PROVENANCE_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUTPUT_JSON"
          python scripts/diagnose_nifty_1m_value_anomalies.py --input-dir "$PLAIN_DIR" --output-json "$OUTPUT_JSON"
          python -m json.tool "$OUTPUT_JSON" >/dev/null

      - name: Remove plaintext and downloaded scratch
        id: cleanup
        if: always()
        env:
          PLAIN_DIR: ${{ runner.temp }}/unmatched-spot-plain
          INPUT_DIR: ${{ runner.temp }}/unmatched-spot-input
          BUNDLE_DIR: ${{ runner.temp }}/unmatched-spot-bundle
        run: |
          set -euo pipefail
          rm -rf "$PLAIN_DIR" "$INPUT_DIR" "$BUNDLE_DIR"
          if find "${{ runner.temp }}" -type f -name 'nifty_1m_composite_*.csv.gz' -print -quit | grep -q .; then
            echo "Unexpected plaintext monthly parts remain in runner temp."
            exit 1
          fi

      - name: Append aggregate findings to README and research status
        if: steps.diagnostic.outcome == 'success' && steps.cleanup.outcome == 'success'
        env:
          OUTPUT_JSON: ${{ github.workspace }}/research/data/UNMATCHED_OPTION_TIMESTAMP_DISTRIBUTION_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
          VALUE_OUTPUT_JSON: ${{ github.workspace }}/research/data/VALUE_ANOMALY_PROVENANCE_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
          TARGET_PATCH_RUN_ID: ${{ env.TARGET_PATCH_RUN_ID }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["OUTPUT_JSON"])
          report=json.loads(p.read_text(encoding="utf-8"))
          v=pathlib.Path(os.environ["VALUE_OUTPUT_JSON"])
          values=json.loads(v.read_text(encoding="utf-8"))
          unmatched=report["unmatched_option_rows"]
          spots=report["spot_coverage"]
          offsets=report["nearest_timestamp_diagnostic_seconds"]
          counts=report["row_counts"]
          issue_counts=values["issue_occurrence_counts"]
          rows=[
            f"- Offline source: encrypted patch artifact 11696937921; patch run https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['TARGET_PATCH_RUN_ID']}.",
            f"- Dataset counts verified: {counts['option_rows']} option rows; {counts['spot_rows']} spot rows.",
            f"- Unmatched option rows: {unmatched['row_count']} across {unmatched['distinct_option_timestamps']} distinct timestamps.",
            f"- Exact match inconsistencies: {unmatched['timestamps_marked_missing_but_present_in_existing_spot_rows']['distinct_timestamps']} unmatched timestamps are already present in the spot row set; R2 overlap is {unmatched['new_r2_patch_exact_timestamp_overlap']['distinct_unmatched_option_timestamps']}.",
            f"- Nearest same-session spot offsets within 60 / 300 seconds: {offsets['nearest_offset_within_60_seconds']} / {offsets['nearest_offset_within_300_seconds']}. This is diagnostic only, not an approximate join.",
            f"- R2 spot rows on weekend-dated session labels: {spots['weekend_spot_rows']}. All rows remain unmodified.",
            f"- Value anomaly occurrence categories: {json.dumps(issue_counts,sort_keys=True)}.",
            f"- Distinct joined-NIFTY OHLC violation epochs: {values['distinct_timestamp_diagnostics']['matched_option_epochs_with_invalid_joined_nifty_ohlc']}; standalone spot OHLC violation epochs: {values['distinct_timestamp_diagnostics']['standalone_spot_epochs_with_ohlc_violations']}.",
            f"- Timestamp report: https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/{p.as_posix()}",
            f"- Value anomaly report: https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/{v.as_posix()}",
            "- No prices were emitted; no source requests, source-row edits, modelling, holdout access or strategies were run."
          ]
          for path,heading in [
            (pathlib.Path("research/STATUS.md"),"Offline unmatched-option timestamp distribution"),
            (pathlib.Path("README.md"),"Offline unmatched-option timestamp distribution")
          ]:
            with path.open("a",encoding="utf-8") as f:
              f.write(f"\n\n## {heading} - patch run {os.environ['TARGET_PATCH_RUN_ID']}\n\n" + "\n".join(rows) + "\n")
          PY

      - name: Commit diagnostic report and status
        if: steps.diagnostic.outcome == 'success' && steps.value_diagnostic.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "research/data/UNMATCHED_OPTION_TIMESTAMP_DISTRIBUTION_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json" "research/data/VALUE_ANOMALY_PROVENANCE_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json" research/STATUS.md README.md
          git commit -m "research: map unmatched option timestamps by date"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized unmatched timestamp distribution
        if: always() && steps.diagnostic.outcome == 'success' && steps.value_diagnostic.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unmatched-and-value-anomaly-diagnostics-${{ env.TARGET_PATCH_RUN_ID }}
          path: |
            research/data/UNMATCHED_OPTION_TIMESTAMP_DISTRIBUTION_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
            research/data/VALUE_ANOMALY_PROVENANCE_R2_RUN_${{ env.TARGET_PATCH_RUN_ID }}.json
          if-no-files-found: error
          retention-days: 90
