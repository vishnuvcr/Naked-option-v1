name: Phase 07 Offline Dataset Preflight Tests
on:
  push:
    branches: [phase-07-developer]
    paths:
      - 'scripts/offline_dataset_preflight.py'
      - 'scripts/test_offline_dataset_preflight.py'
      - 'scripts/test_offline_dataset_actual_schema.py'
      - 'scripts/check_workflow_action_pinning.py'
      - 'scripts/test_workflow_action_pinning.py'
      - 'scripts/validate_real_file_preflight_authorization.py'
      - 'scripts/test_validate_real_file_preflight_authorization.py'
      - 'scripts/publish_preflight_receipt.py'
      - 'scripts/test_publish_preflight_receipt.py'
      - 'scripts/test_receipt_workflow_policy.py'
      - '.github/workflows/phase-07-publish-preflight-receipt.yml'
      - '.github/workflows/phase-07-receipt-publisher-tests.yml'
      - '.github/workflows/phase-07-real-file-preflight-audit.yml'
      - '.github/workflows/phase-07-offline-preflight-tests.yml'
  pull_request:
    branches: [phase-07-developer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Enforce immutable action pins and least-privilege policy
        run: python scripts/check_workflow_action_pinning.py .github/workflows/phase-07-offline-preflight-tests.yml
      - name: Run deterministic synthetic fixtures only
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_offline_dataset_preflight.py scripts/test_offline_dataset_actual_schema.py scripts/test_workflow_action_pinning.py scripts/test_validate_real_file_preflight_authorization.py scripts/test_publish_preflight_receipt.py scripts/test_receipt_workflow_policy.py
      - name: Ensure no real data or credentials are staged
        run: |
          test ! -e nifty_repaired_composite_2021-10_to-2026-10.csv
          test ! -e nifty_repaired_composite_2021-10_to-2026-10.csv.gz
          test ! -e .env
