name: NIFTY 1-Minute Composite — Guarded Historical Data Acquisition

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/gates/NIFTY_1M_COMPOSITE_APPROVAL.json"
      - ".github/workflows/phase-07-nifty-1m-composite-live.yml"
  workflow_dispatch:
    inputs:
      confirm_live_acquisition:
        description: "Confirm the exact tester-approved request grid. This makes up to 8,701 bounded wire requests and saves encrypted outputs only."
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: nifty-1m-composite-live-campaign
  cancel-in-progress: false

jobs:
  guarded-acquisition:
    if: >-
      ${{ github.ref }} == 'refs/heads/phase-07-developer' &&
      (
        ( ${{ github.event_name }} == 'workflow_dispatch' && ${{ inputs.confirm_live_acquisition }} == true) ||
        ( __EVENT__ == 'push' && contains(${{ github.event.head_commit.message }}, 'READY NIFTY 1m composite acquisition approval'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-composite.txt

      - name: Install encryption dependency
        run: python -m pip install -r requirements-composite.txt

      - name: Run offline regressions before touching credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_nifty_1m_composite_dataset.py \
            scripts/decrypt_nifty_1m_composite.py \
            scripts/validate_nifty_1m_composite_manifest.py \
            scripts/test_nifty_1m_composite_dataset.py \
            scripts/test_nifty_1m_composite_manifest.py \
            scripts/validate_nifty_1m_composite_approval.py
          (cd scripts && python -m unittest -v test_nifty_1m_composite_manifest)
          (cd scripts && python -m unittest -v test_nifty_1m_composite_dataset)
          python scripts/validate_nifty_1m_composite_manifest.py

      - name: Fetch isolated tester decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase-07-tester

      - name: Validate current tester approval and protected source/request pins
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_nifty_1m_composite_approval.py check

      - name: Confirm required secrets exist without exposing values
        env:
          DHAN_CONFIGURED: ${{ secrets.DHAN_ACCESS_TOKEN != '' }}
          HF_CONFIGURED: ${{ secrets.HF_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DHAN_CONFIGURED" != "true" ]]; then
            echo "Blocked: DHAN_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [[ "$HF_CONFIGURED" != "true" ]]; then
            echo "Blocked: HF_TOKEN is not configured for encrypted local cache/output."
            exit 1
          fi
          echo "Required secret names are configured; values were not read or printed."

      - name: Restore encrypted source-response cache and progress metadata
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/nifty_1m_composite/raw
            data/reports/nifty_1m_composite
          key: nifty1m-composite-${{ github.run_id }}
          restore-keys: |
            nifty1m-composite-

      - name: Spend acquisition approval before the first network request
        id: spend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_nifty_1m_composite_approval.py spend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gates/NIFTY_1M_COMPOSITE_APPROVAL.json
          git commit -m "Spend NIFTY 1m composite acquisition approval before source requests"
          git push origin HEAD:phase-07-developer

      - name: Acquire bounded Dhan spot and rolling-option history and export encrypted CSV parts
        id: acquire
        if: steps.spend.outcome == 'success'
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_nifty_1m_composite_dataset.py

      - name: Persist encrypted response cache and source progress
        if: always() && steps.spend.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/nifty_1m_composite/raw
            data/reports/nifty_1m_composite
          key: nifty1m-composite-__RUN_ID__

      - name: Seal completion/partial status
        if: always() && steps.spend.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_nifty_1m_composite_approval.py finish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research/gates/NIFTY_1M_COMPOSITE_APPROVAL.json
          git commit -m "Record NIFTY 1m composite acquisition disposition"
          git push origin HEAD:phase-07-developer

      - name: Upload encrypted offline dataset bundle and metadata only
        if: always() && steps.spend.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nifty-1m-composite-encrypted-bundle
          path: |
            data/exports/nifty_1m_composite/encrypted/*.csv.gz.enc
            data/exports/nifty_1m_composite/dataset_manifest.json
            data/exports/nifty_1m_composite/coverage_and_errors.json
            data/exports/nifty_1m_composite/README.md
          if-no-files-found: warn
          retention-days: 90

# The public repo receives request manifests and redacted status only. Raw and CSV market rows are AES-256-GCM encrypted; plaintext CSV scratch files are deleted before artifact upload. No model fitting or holdout access is part of this workflow.
