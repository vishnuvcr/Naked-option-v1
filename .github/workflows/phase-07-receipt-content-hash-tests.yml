name: Phase 07 Receipt Content Hash Tests

on:
  push:
    branches: [phase-07-receipt-content-hash-developer-20261011]
    paths:
      - 'scripts/publish_preflight_receipt.py'
      - 'scripts/test_publish_preflight_receipt.py'
      - 'scripts/test_receipt_workflow_policy.py'
      - '.github/workflows/phase-07-receipt-content-hash-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publish_preflight_receipt.py'
      - 'scripts/test_publish_preflight_receipt.py'
      - 'scripts/test_receipt_workflow_policy.py'
      - '.github/workflows/phase-07-receipt-content-hash-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-content-hash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate receipt workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |p| YAML.parse_file(p); puts "PASS YAML: #{p}" }' .github/workflows/phase-07-publish-preflight-receipt.yml .github/workflows/phase-07-receipt-publisher-tests.yml .github/workflows/phase-07-receipt-content-hash-tests.yml
      - name: Run receipt content-hash and sanitization regression suite
        run: python -m unittest -v scripts/test_publish_preflight_receipt.py scripts/test_receipt_workflow_policy.py
