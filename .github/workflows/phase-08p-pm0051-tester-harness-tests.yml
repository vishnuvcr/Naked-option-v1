name: Phase 8P PM0051 independent-auditor synthetic tests
on:
  push:
    branches: [phase-08-prediction-tester]
    paths:
      - scripts/independent_pm0051_results_audit_r3.py
      - scripts/test_independent_pm0051_results_audit_r3.py
      - .github/workflows/phase-08p-pm0051-tester-harness-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-auditor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tester snapshot
        uses: actions/checkout@v4
        with:
          ref: phase-08-prediction-tester
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic audit tests (no market data)
        run: |
          python -m unittest discover -s scripts -p 'test_independent_pm0051_results_audit_r3.py' -v
