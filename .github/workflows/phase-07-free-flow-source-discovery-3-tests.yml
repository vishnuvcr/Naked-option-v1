name: Extension 2 Free Flow Source Discovery 3 — Offline Tests

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "research/phase7/EXTENSION2_FREE_FLOW_SOURCE_DISCOVERY_3_SPEC.md"
      - "scripts/extension2_free_flow_source_discovery_3.py"
      - "scripts/test_extension2_free_flow_source_discovery_3.py"
      - "requirements-source-discovery-3.txt"
      - ".github/workflows/phase-07-free-flow-source-discovery-3-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-flow-discovery-3-offline-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-source-discovery-tests:
    name: offline-source-discovery-tests-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-source-discovery-3.txt
      - name: Install pinned parser dependency only
        run: python -m pip install -r requirements-source-discovery-3.txt
      - name: Run offline source-discovery fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_extension2_free_flow_source_discovery_3.py

# This workflow intentionally has no live source-fetch step. The tests use only
# synthetic fixtures/mocked responses; a passing run does not authorize source access.
