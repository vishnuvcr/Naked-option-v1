name: Phase 8 Long-Option Research

on:
  workflow_call:
    inputs:
      empirical_authorized:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      empirical_authorized:
        description: "Tester-approved empirical authorization"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  REFERENCE_RUN_ID: "37957677656"
  REFERENCE_COMMIT: "b50be8cfa1ebe008a800e65a53f9c0fb2581aecb"
  REFERENCE_ARTIFACT_ID: "11638738288"
  REFERENCE_ARTIFACT_SHA256: "3e8a22ded608668b5674f7aed609fefa5c4befcde39a58b7f208e59ab25959a9"
  REFERENCE_MANIFEST_SHA256: "f0efc378bb3c41c8b51c6f47f0f9b7336111e57527d9e047241856274fa49091"
  REFERENCE_AGGREGATE_SHA256: "96c1428f448b1f91e50a2efd1253884e0f11d044c1c57d9a1fda60d61ab7fc39"

jobs:
  protocol:
    name: phase8-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow
      - name: Validate frozen Phase 8 contract
        run: |
          test -f research/gates/PHASE8_SPEC_APPROVAL_TESTER.md
          test -f research/gates/PHASE8_RECONSTRUCTION_CODE_TESTER.md
          test -f research/gates/PHASE8_EXECUTION_CONVENTIONS_TESTER.md
          test -f research/gates/PHASE8_EXECUTION_ENGINE_APPROVAL_TESTER.md
          python - <<'PY'
          import json, os
          p=json.load(open("research/phase8/PHASE8_FROZEN_INPUT_MANIFEST.json"))
          assert p["reference_version"] == "R2"
          assert p["phase7_run"] == 994
          assert p["workflow_run_id"] == int(os.environ["REFERENCE_RUN_ID"])
          assert p["developer_commit"] == os.environ["REFERENCE_COMMIT"]
          assert p["artifact_id"] == int(os.environ["REFERENCE_ARTIFACT_ID"])
          assert p["artifact_sha256"] == os.environ["REFERENCE_ARTIFACT_SHA256"]
          assert p["embedded_manifest_sha256"] == os.environ["REFERENCE_MANIFEST_SHA256"]
          assert p["aggregate_result_sha256"] == os.environ["REFERENCE_AGGREGATE_SHA256"]
          assert p["forecast_panel_count"] == 10 and p["forecast_rows_total"] == 50555
          assert p["empirical_option_execution_authorized"] is False
          assert p["reconstruction_tolerance_abs"] == 1e-9
          PY
      - name: Validate literature registry
        run: python scripts/validate_literature_registry.py

  regression:
    name: phase8-regression
    needs: protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow
      - name: Workflow contract regression
        run: python scripts/test_phase8_workflow_contract.py
      - name: Reconstruction legacy fail-closed regression
        run: python scripts/test_phase8_reconstruction.py
      - name: Saved forecast-panel regression (synthetic only)
        run: python scripts/test_phase8_reference_panels.py
      - name: Execution-engine regression
        run: PYTHONPATH=scripts python scripts/test_phase8_execution_engine.py
      - name: No-refit runner contract regression (synthetic only)
        run: PYTHONPATH=scripts python scripts/test_phase8_long_option_runner.py
      - name: No-refit runner pure self-test
        run: python scripts/run_phase8_long_option.py --self-test

  artifact:
    name: phase8-run994-reference-artifact
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached immutable Run #994 reference artifact
        uses: actions/cache/restore@v4
        with:
          path: data/cache/reference/phase7_run994
          key: phase8-run994-${{ env.REFERENCE_ARTIFACT_SHA256 }}
      - name: Restore or download immutable Run #994 reference artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cache/reference/phase7_run994
          zip="data/cache/reference/phase7_run994/phase7_reference.zip"
          if [ ! -s "$zip" ]; then
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" --output "$zip"
          fi
          test -s "$zip"
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          echo "Downloaded Run #994 archive SHA-256: $actual"
          if [ "$actual" != "$REFERENCE_ARTIFACT_SHA256" ]; then
            echo "REFERENCE_ARCHIVE_HASH_MISMATCH expected=$REFERENCE_ARTIFACT_SHA256 actual=$actual"
            exit 1
          fi
          rm -rf data/cache/reference/phase7_run994/unpacked
          mkdir -p data/cache/reference/phase7_run994/unpacked
          unzip -q "$zip" -d data/cache/reference/phase7_run994/unpacked
          manifest="data/cache/reference/phase7_run994/unpacked/phase7_reference/phase7_reference_manifest.json"
          aggregate="data/cache/reference/phase7_run994/unpacked/phase7_ensemble_results.json"
          test -s "$manifest" && test -s "$aggregate"
          manifest_actual="$(sha256sum "$manifest" | awk '{print $1}')"
          aggregate_actual="$(sha256sum "$aggregate" | awk '{print $1}')"
          echo "Embedded manifest SHA-256: $manifest_actual"
          echo "Paired aggregate SHA-256: $aggregate_actual"
          if [ "$manifest_actual" != "$REFERENCE_MANIFEST_SHA256" ]; then
            echo "REFERENCE_MANIFEST_HASH_MISMATCH expected=$REFERENCE_MANIFEST_SHA256 actual=$manifest_actual"
            exit 1
          fi
          if [ "$aggregate_actual" != "$REFERENCE_AGGREGATE_SHA256" ]; then
            echo "REFERENCE_AGGREGATE_HASH_MISMATCH expected=$REFERENCE_AGGREGATE_SHA256 actual=$aggregate_actual"
            exit 1
          fi
          python - <<'PY'
          import json, os
          m=json.load(open("data/cache/reference/phase7_run994/unpacked/phase7_reference/phase7_reference_manifest.json"))
          assert m["status"] == "COMPLETE" and m["schema_version"] == 1
          assert str(m["run_id"]) == os.environ["REFERENCE_RUN_ID"]
          assert m["commit"] == os.environ["REFERENCE_COMMIT"]
          assert len(m["prediction_panels"]) == 10
          assert sum(int(x["rows"]) for x in m["prediction_panels"]) == 50555
          PY
      - name: Cache immutable Run #994 reference artifact
        uses: actions/cache/save@v4
        with:
          path: data/cache/reference/phase7_run994
          key: phase8-run994-${{ env.REFERENCE_ARTIFACT_SHA256 }}

  sources:
    name: phase8-free-source-audit
    needs: protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached phase8 raw source audit
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/raw/nse_fno_samples
            data/cache/raw/hf_reference
          key: phase8-free-source-${{ runner.os }}-${{ hashFiles('research/phase8/PHASE8_DATA_PLAN.md','scripts/audit_phase8_option_sources.py','scripts/reconcile_official_vs_hf.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyarrow
      - name: Audit free sources
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_phase8_option_sources.py
      - name: Acquire official sample archives
        run: python scripts/acquire_official_option_samples.py
      - name: Validate official option schemas
        run: python scripts/validate_official_option_samples.py
      - name: Acquire secondary HF option sample
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf_reference.py
      - name: Reconcile official NSE versus secondary sample
        run: python scripts/reconcile_official_vs_hf.py
      - name: Validate date-aware lot size
        run: python scripts/validate_lot_size_udiff.py
      - name: Upload source-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase8-source-audit
          path: data/reports/phase8/official_vs_hf_reconciliation.json
      - name: Cache phase8 raw source audit
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/raw/nse_fno_samples
            data/cache/raw/hf_reference
          key: phase8-free-source-${{ runner.os }}-${{ hashFiles('research/phase8/PHASE8_DATA_PLAN.md','scripts/audit_phase8_option_sources.py','scripts/reconcile_official_vs_hf.py') }}

  reconstruct:
    name: phase8-forecast-reconstruction
    needs: [artifact, regression]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow
      - name: Restore cached Run #994 reference artifact
        uses: actions/cache/restore@v4
        with:
          path: data/cache/reference/phase7_run994
          key: phase8-run994-${{ env.REFERENCE_ARTIFACT_SHA256 }}
      - name: Restore source data needed for independent panel lineage validation
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: phase8-phase3-source-${{ runner.os }}-${{ hashFiles('research/phase2/**','research/phase6/PHASE6_METHOD_SPEC.md') }}
          restore-keys: |
            phase8-phase3-source-${{ runner.os }}-
      - name: Require cached source data for offline reconstruction
        run: |
          set -euo pipefail
          test -s data/cache/raw/phase3/nifty50_daily.csv || { echo "CACHE_MISS: daily NIFTY source absent; refusing network acquisition during frozen-artifact reconstruction"; exit 2; }
          test -s data/cache/raw/phase3/hf_intraday/nifty50_index_reference.parquet || { echo "CACHE_MISS: intraday reference absent; refusing network acquisition during frozen-artifact reconstruction"; exit 2; }
          echo "CACHE_ONLY_RECONSTRUCTION=true"
          sha256sum data/cache/raw/phase3/nifty50_daily.csv data/cache/raw/phase3/hf_intraday/nifty50_index_reference.parquet
      - name: Validate saved Run #994 forecasts without model refit
        run: |
          set -o pipefail
          mkdir -p data/reports/phase8
          if ! python scripts/validate_phase7_reference_panels.py --artifact-dir data/cache/reference/phase7_run994/unpacked --output-dir data/reports/phase8 >data/reports/phase8/saved_panel_validation_stdout.log 2>&1; then
            echo "SAVED_PANEL_VALIDATION_FAILED"
            tail -n 200 data/reports/phase8/saved_panel_validation_stdout.log
            exit 1
          fi
          tail -n 60 data/reports/phase8/saved_panel_validation_stdout.log
      - name: Validate forecast panel
        run: python scripts/validate_phase8_forecast_panel.py
      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-forecast-reconstruction
          path: data/reports/phase8/

  empirical-authorization:
    name: phase8-empirical-authorization
    needs: [protocol, regression, artifact, sources, reconstruct]
    if: ${{ inputs.empirical_authorized == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless tester authorization exists
        env:
          EMPIRICAL_AUTHORIZED_INPUT: ${{ inputs.empirical_authorized }}
        run: |
          set -euo pipefail
          test "$EMPIRICAL_AUTHORIZED_INPUT" = "true"
          test -f research/phase8/PHASE8_EMPIRICAL_AUTHORIZATION.md
          grep -q "STATUS: AUTHORIZED" research/phase8/PHASE8_EMPIRICAL_AUTHORIZATION.md
          test ! -f research/phase8/PHASE8_FROZEN_INPUT_MANIFEST_EMPIRICAL_OVERRIDE.json
          echo "Phase 8 empirical authorization gate PASS"

  empirical:
    name: phase8-empirical-4800-cell
    needs: empirical-authorization
    if: ${{ inputs.empirical_authorized == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scikit-learn
      - name: Refuse placeholder empirical execution
        run: |
          if [ ! -f scripts/run_phase8_long_option.py ]; then
            echo "Empirical runner not yet present; empirical authorization must remain disabled."
            exit 1
          fi
      - name: Run registered 4,800-cell grid
        run: python scripts/run_phase8_long_option.py
