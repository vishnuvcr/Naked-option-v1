name: Prediction Registry Shard Utility Tests

on:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/shard_prediction_registry.py"
      - "scripts/test_shard_prediction_registry.py"
      - "scripts/reshard_prediction_registry.py"
      - "scripts/test_reshard_prediction_registry.py"
      - "scripts/build_prediction_compatibility_matrix.py"
      - "scripts/test_prediction_compatibility_matrix.py"
      - "research/registry/PREDICTION_PREREGISTRATION_V2_R2.json"
      - "scripts/audit_prediction_registry_shards.py"
      - "research/registry/**"
      - ".github/workflows/prediction-registry-shard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout committed developer artifacts
        uses: actions/checkout@v4
        with:
          ref: phase-08-prediction-developer
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test shard utility
        run: python -m unittest discover -s scripts -p "test_shard_prediction_registry.py" -v
      - name: Test deterministic re-sharder
        run: python -m unittest discover -s scripts -p "test_reshard_prediction_registry.py" -v
      - name: Build row-level compatibility matrix
        run: python scripts/build_prediction_compatibility_matrix.py
      - name: Test compatibility matrix rules
        run: python -m unittest discover -s scripts -p "test_prediction_compatibility_matrix.py" -v
      - name: Check whether generated compatibility output is committed
        shell: bash
        run: |
          git add -N -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md
          if git diff --quiet -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md; then
            echo "Committed compatibility output matches deterministic builder."
          else
            echo "::warning::Compatibility output is stale/uncommitted at this source commit; the repair workflow must commit regenerated output before scientific review."
            git diff --stat -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md
          fi
      - name: Verify standard SHA-256 vector
        run: |
          python - <<'PY'
          import hashlib
          expected = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          actual = hashlib.sha256(b"abc").hexdigest()
          assert actual == expected, (actual, expected)
          print("SHA-256 known vector: PASS")
          PY
      - name: Audit committed R2 registry shards and index
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_prediction_registry_shards.py | tee /tmp/r2-registry-audit.json
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-registry-integrity-audit-independent-run
          path: /tmp/r2-registry-audit.json
          if-no-files-found: warn
