name: Prediction Registry Shard Utility Tests

on:
  push:
    branches:
      - phase-08-prediction-developer
    paths:
      - "scripts/shard_prediction_registry.py"
      - "scripts/test_shard_prediction_registry.py"
      - "scripts/reshard_prediction_registry.py"
      - "scripts/test_reshard_prediction_registry.py"
      - "scripts/build_prediction_compatibility_matrix.py"
      - "scripts/test_prediction_compatibility_matrix.py"
      - "scripts/prediction_registry_synthetic_dryrun.py"
      - "scripts/test_prediction_registry_synthetic_dryrun.py"
      - "scripts/test_prediction_preregistration.py"
      - "scripts/prediction_statistics.py"
      - "scripts/test_prediction_statistics.py"
      - "scripts/shard_prediction_compatibility_matrix.py"
      - "scripts/test_shard_prediction_compatibility_matrix.py"
      - "research/registry/PREDICTION_LABEL_MANIFEST_V2_R2.json"
      - "research/registry/PREDICTION_PREREGISTRATION_V2_R2.json"
      - "scripts/audit_prediction_registry_shards.py"
      - ".github/workflows/prediction-registry-shard-tests.yml"
      - "scripts/build_prediction_horizon_registry_r3.py"
      - "scripts/test_prediction_horizon_registry_r3.py"
      - ".github/workflows/phase-08p-complete-horizon-registry-r3.yml"
      - "research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json"
      - "research/registry/PREDICTION_LABEL_MANIFEST_V2_R2.json"
      - "research/registry/PREDICTION_REGISTRY_SHARD_INDEX_V2_R2.json"
      - "research/registry/PREDICTION_PREREGISTRATION_V2_R2.json"
      - "research/registry/compatibility_shards/**"
      - "research/registry/config_shards/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout committed developer artifacts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact workflow-trigger commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Pinned checkout: $(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test shard utility
        run: python -m unittest discover -s scripts -p "test_shard_prediction_registry.py" -v
      - name: Test deterministic re-sharder
        run: python -m unittest discover -s scripts -p "test_reshard_prediction_registry.py" -v
      - name: Build row-level compatibility matrix
        run: python scripts/build_prediction_compatibility_matrix.py
      - name: Test compatibility matrix rules
        run: python -m unittest discover -s scripts -p "test_prediction_compatibility_matrix.py" -v
      - name: Generate small reviewable compatibility shards
        run: python scripts/shard_prediction_compatibility_matrix.py
      - name: Verify compatibility shard hashes and reconstruction
        run: python -m unittest discover -s scripts -p "test_shard_prediction_compatibility_matrix.py" -v
      - name: Test frozen preregistration source pins and statistical rules
        run: python -m unittest discover -s scripts -p "test_prediction_preregistration.py" -v
      - name: Test paired block bootstrap and BY FDR numerics
        run: python -m unittest discover -s scripts -p "test_prediction_statistics.py" -v
      - name: Test synthetic checkpoint/restart and error logging
        run: python -m unittest discover -s scripts -p "test_prediction_registry_synthetic_dryrun.py" -v
      - name: Check whether generated compatibility output is committed
        shell: bash
        run: |
          git add -N -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md
          if git diff --quiet -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md; then
            echo "Committed compatibility output matches deterministic builder."
          else
            echo "::warning::Compatibility output is stale/uncommitted at this source commit; the repair workflow must commit regenerated output before scientific review."
            git diff --stat -- research/registry/PREDICTION_COMPATIBILITY_MATRIX_V2_R2.json research/registry/PREDICTION_COMPATIBILITY_MATRIX_R2.md
          fi
      - name: Verify standard SHA-256 vector
        run: |
          python - <<'PY'
          import hashlib
          expected = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          actual = hashlib.sha256(b"abc").hexdigest()
          assert actual == expected, (actual, expected)
          print("SHA-256 known vector: PASS")
          PY
      - name: Audit committed R2 registry shards and index
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_prediction_registry_shards.py | tee /tmp/r2-registry-audit.json
      - name: Commit generated review shards and index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/registry/compatibility_shards research/registry/PREDICTION_COMPATIBILITY_SHARD_INDEX_V2_R2.json
          if git diff --cached --quiet; then
            echo "Review shards already match the deterministic source matrix."
          else
            git commit -m "Publish independently inspectable compatibility matrix shards"
            git push origin HEAD:phase-08-prediction-developer
          fi
      - name: Upload machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-registry-integrity-audit-independent-run
          path: /tmp/r2-registry-audit.json
          if-no-files-found: warn

  full-horizon-r3-registry:
    # Run independently so an unrelated R2 audit problem cannot silently suppress R3 build diagnostics.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact source commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "R3 registry source pin: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build full ten-horizon registry without data access or fitting
        shell: bash
        run: |
          set +e
          mkdir -p research/gates
          python scripts/build_prediction_horizon_registry_r3.py > /tmp/r3-build.log 2>&1
          rc=$?
          cat /tmp/r3-build.log
          cp /tmp/r3-build.log research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_LOG_R3_2026-10-13.txt
          python - "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          Path("research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_ATTEMPT_R3_2026-10-13.json").write_text(
              json.dumps({
                  "build_step_exit_code": int(sys.argv[1]),
                  "builder": "scripts/build_prediction_horizon_registry_r3.py",
                  "source_commit": __import__("subprocess").check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "market_data_opened": False,
                  "model_fitting_performed": False,
                  "holdout_accessed": False
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: Run complete horizon, integrity and provenance tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s scripts -p "test_prediction_horizon_registry_r3.py" -v > /tmp/r3-registry-tests.log 2>&1
          rc=$?
          cat /tmp/r3-registry-tests.log
          cp /tmp/r3-registry-tests.log research/gates/PREDICTION_HORIZON_REGISTRY_TEST_LOG_R3_2026-10-13.txt
          python - "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_ATTEMPT_R3_2026-10-13.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          state["registry_test_exit_code"] = int(sys.argv[1])
          path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          PY
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: Confirm R2 source pilot stayed unchanged
        run: |
          git diff --exit-code -- \
            research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json \
            research/registry/PREDICTION_LABEL_MANIFEST_V2_R2.json \
            research/registry/PREDICTION_PREREGISTRATION_V2_R2.json \
            research/registry/PREDICTION_REGISTRY_SHARD_INDEX_V2_R2.json \
            research/registry/config_shards \
            research/registry/compatibility_shards

      - name: Upload R3 developer diagnostics and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-08p-horizon-registry-r3-developer-checks
          path: |
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_REPORT_R3_2026-10-13.json
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_LOG_R3_2026-10-13.txt
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_ATTEMPT_R3_2026-10-13.json
            research/gates/PREDICTION_HORIZON_REGISTRY_TEST_LOG_R3_2026-10-13.txt
            research/registry/PREDICTION_LABEL_MANIFEST_R3_2026-10-13.json
            research/registry/PREDICTION_CONFIG_MANIFEST_R3_2026-10-13.json
            research/registry/PREDICTION_REGISTRY_SHARD_INDEX_R3_2026-10-13.json
            research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json
          if-no-files-found: warn

      - name: Commit generated R3 artifacts after successful validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          git add research/registry/config_shards_r3 \
            research/registry/PREDICTION_LABEL_MANIFEST_R3_2026-10-13.json \
            research/registry/PREDICTION_CONFIG_MANIFEST_R3_2026-10-13.json \
            research/registry/PREDICTION_REGISTRY_SHARD_INDEX_R3_2026-10-13.json \
            research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_REPORT_R3_2026-10-13.json \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_LOG_R3_2026-10-13.txt \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_ATTEMPT_R3_2026-10-13.json \
            research/gates/PREDICTION_HORIZON_REGISTRY_TEST_LOG_R3_2026-10-13.txt
          if git diff --cached --quiet; then
            echo "R3 output is already current; no commit required."
            exit 0
          fi
          git commit -m "Build and validate complete ten-horizon prediction registry R3"
          git push origin HEAD:phase-08-prediction-developer

      - name: Preserve R3 errors for developer repair
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          for p in \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_LOG_R3_2026-10-13.txt \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_ATTEMPT_R3_2026-10-13.json \
            research/gates/PREDICTION_HORIZON_REGISTRY_TEST_LOG_R3_2026-10-13.txt; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No R3 diagnostics to commit."
            exit 0
          fi
          git commit -m "Log developer R3 registry build/test failure"
          git push origin HEAD:phase-08-prediction-developer

