name: Phase 8P full-horizon R3 registry build and developer QA

on:
  push:
    branches: [phase-08-prediction-developer]
    paths:
      - 'scripts/build_prediction_horizon_registry_r3.py'
      - 'scripts/test_prediction_horizon_registry_r3.py'
      - 'scripts/prediction_statistics.py'
      - 'scripts/test_prediction_statistics.py'
      - 'scripts/test_prediction_preregistration.py'
      - 'research/registry/PREDICTION_CONFIG_MANIFEST_V2_R2.json'
      - 'research/registry/PREDICTION_REGISTRY_SHARD_INDEX_V2_R2.json'
      - 'research/registry/PREDICTION_LABEL_MANIFEST_V2_R2.json'
      - 'research/registry/PREDICTION_PREREGISTRATION_V2_R2.json'
      - 'research/registry/config_shards/**'
      - '.github/workflows/phase-08p-horizon-registry-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering developer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Pinned developer checkout: $(git rev-parse HEAD)" | tee workflow-source.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile R3 build and test modules
        run: |
          python -m py_compile scripts/build_prediction_horizon_registry_r3.py scripts/test_prediction_horizon_registry_r3.py scripts/prediction_statistics.py scripts/test_prediction_statistics.py scripts/test_prediction_preregistration.py

      - name: Build complete ten-horizon registry (no market data access)
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_prediction_horizon_registry_r3.py 2>&1 | tee r3-registry-build.log

      - name: Validate complete R3 ten-horizon registry
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p "test_prediction_horizon_registry_r3.py" -v 2>&1 | tee r3-horizon-tests.log

      - name: Re-run statistical utility regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p "test_prediction_statistics.py" -v 2>&1 | tee r3-statistics-tests.log

      - name: Validate frozen R2 preregistration source pins remain intact
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts -p "test_prediction_preregistration.py" -v 2>&1 | tee r2-prereg-tests.log

      - name: Audit original R2 source registry is unchanged and valid
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_prediction_registry_shards.py 2>&1 | tee r2-source-audit.log

      - name: Verify no encrypted data or holdout was opened
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_REPORT_R3_2026-10-13.json").read_text(encoding="utf-8"))
          assert report["empirical_fitting_performed"] is False
          assert report["market_data_opened"] is False
          assert report["holdout_accessed"] is False
          assert report["configuration_count"] == 40000
          assert report["configuration_shard_count"] == 400
          print("R3 builder guard assertions: PASS")
          PY

      - name: Commit generated immutable R3 registry artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Naked Option Research Automation"
          git config user.email "research-automation@users.noreply.github.com"
          git add research/registry/PREDICTION_LABEL_MANIFEST_R3_2026-10-13.json \
            research/registry/PREDICTION_CONFIG_MANIFEST_R3_2026-10-13.json \
            research/registry/PREDICTION_REGISTRY_SHARD_INDEX_R3_2026-10-13.json \
            research/registry/PREDICTION_PREREGISTRATION_R3_2026-10-13.json \
            research/registry/config_shards_r3/ \
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_REPORT_R3_2026-10-13.json
          if git diff --cached --quiet; then
            echo "R3 registry outputs are byte-identical to the existing committed build."
          else
            git commit -m "Build full ten-horizon R3 prediction registry"
            git push origin HEAD:phase-08-prediction-developer
          fi

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-08p-r3-registry-developer-qa
          path: |
            workflow-source.txt
            r3-registry-build.log
            r3-horizon-tests.log
            r3-statistics-tests.log
            r2-prereg-tests.log
            r2-source-audit.log
            research/gates/PREDICTION_HORIZON_REGISTRY_BUILD_REPORT_R3_2026-10-13.json
          if-no-files-found: warn
