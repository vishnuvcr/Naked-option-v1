name: Phase 7 Dhan Daily Sample Gate — Offline Tests

on:
  push:
    branches: [phase-07-developer]
    paths:
      - "scripts/dhan_history_pipeline.py"
      - "scripts/test_dhan_history_pipeline.py"
      - "scripts/run_dhan_daily_sample.py"
      - "scripts/test_run_dhan_daily_sample.py"
      - "scripts/validate_dhan_daily_sample_approval.py"
      - "scripts/test_validate_dhan_daily_sample_approval.py"
      - ".github/workflows/phase-07-dhan-daily-sample-tests.yml"
      - ".github/workflows/phase-07-dhan-daily-sample-live.yml"
      - "research/gates/DHAN_DAILY_SAMPLE_REQUEST.json"
      - "research/gates/DHAN_DAILY_SAMPLE_APPROVAL.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-dhan-daily-sample-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests-only-no-secrets-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all Dhan history and one-use gate regressions offline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dhan_history_pipeline.py
          python scripts/test_run_dhan_daily_sample.py
          python scripts/test_validate_dhan_daily_sample_approval.py
          python scripts/dhan_history_pipeline.py
      - name: Print verified manifest fingerprints using Python hashlib and Git
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path(".")
          manifest_path = root / "research/gates/DHAN_DAILY_SAMPLE_REQUEST.json"
          raw = manifest_path.read_bytes()
          manifest = json.loads(raw)
          authorization = manifest["authorization"]
          canonical = json.dumps(authorization, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          files = {}
          for path in sorted(authorization["protected_files"]):
              p = root / path
              files[path] = {
                  "git_blob": subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip(),
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              }
          print("VERIFIED_MANIFEST_FINGERPRINTS=" + json.dumps({
              "head_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "manifest_git_blob": subprocess.check_output(["git", "rev-parse", "HEAD:" + str(manifest_path)], text=True).strip(),
              "manifest_sha256": hashlib.sha256(raw).hexdigest(),
              "authorization_sha256": hashlib.sha256(canonical).hexdigest(),
              "protected_files": files,
              "protected_files_match_manifest": all(
                  files[k]["git_blob"] == v["git_blob"] and files[k]["sha256"] == v["sha256"]
                  for k, v in authorization["protected_files"].items()
              ),
              "authorization_digest_matches_manifest": hashlib.sha256(canonical).hexdigest() == manifest.get("authorization_sha256"),
          }, sort_keys=True))
          PY
      - name: Validate one-use gate for its current state (read only)
        shell: bash
        run: |
          set -euo pipefail
          approval_status="$(python -c 'import json; print(json.load(open("research/gates/DHAN_DAILY_SAMPLE_APPROVAL.json", encoding="utf-8"))["status"])')"
          case "$approval_status" in
            PENDING_REVIEW)
              python scripts/validate_dhan_daily_sample_approval.py review-check
              ;;
            READY)
              python scripts/validate_dhan_daily_sample_approval.py check
              ;;
            SPENT)
              echo "One-use approval is SPENT; this offline-only workflow will not initiate or repeat acquisition."
              ;;
            *)
              echo "Blocked: unknown one-use approval state."
              exit 1
              ;;
          esac
