name: Phase 7 Run 925 Independent Artifact Audit

on:
  push:
    branches:
      - phase-07-tester
    paths:
      - ".github/workflows/phase7-run925-independent-audit.yml"
      - "scripts/audit_phase7_run925_artifact.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit-run925:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout independent tester code
        uses: actions/checkout@v4

      - name: Checkout immutable empirical source snapshot
        uses: actions/checkout@v4
        with:
          ref: 682eadf2a9eb4de250bc3db27d02e57f88687fa1
          path: source_snapshot
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"
          cache: pip

      - name: Install pinned audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.6 pandas==3.0.6 scikit-learn==1.9.1 scipy==1.17.1 pyarrow==26.0.0 threadpoolctl==3.7.0

      - name: Acquire source snapshot data with manifest-compatible acquisition code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python source_snapshot/scripts/acquire_nifty_daily_history.py
          python source_snapshot/scripts/acquire_hf_intraday_sample.py

      - name: Download immutable Run 925 reference artifact
        uses: actions/download-artifact@v4
        with:
          name: phase7-ensemble-reference
          run-id: 37914905848
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit_artifacts/reference

      - name: Download immutable Run 925 aggregate results
        uses: actions/download-artifact@v4
        with:
          name: phase7-ensemble-results
          run-id: 37914905848
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit_artifacts/results

      - name: Audit artifact hashes, source alignment and all metrics independently
        run: |
          python scripts/audit_phase7_run925_artifact.py \
            --artifact-root audit_artifacts/reference \
            --results-root audit_artifacts/results \
            --source-root source_snapshot \
            --expected-run-id 37914905848 \
            --expected-commit 682eadf2a9eb4de250bc3db27d02e57f88687fa1 \
            --report audit_out/phase7_run925_audit.json

      - name: Preserve independent audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-run925-independent-audit
          path: audit_out/phase7_run925_audit.json
          if-no-files-found: warn
